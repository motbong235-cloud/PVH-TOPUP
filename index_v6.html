<!--
DESIGN PLAN — PVH TOPUP storefront (v3: Receipt & Ticket, per user request)
Subject: Cambodian mobile-game diamond top-up shop, paid via KHQR (Bakong).
Audience: young Khmer mobile gamers on phones, low patience, want 3 taps to pay.
Page's job: pick game -> pick diamond package -> confirm player ID -> pay via KHQR -> see delivery.

Concept: the whole UI reads as a strip of paper receipts and torn arcade tickets —
the literal artifact this business hands out every day (a KHQR payment slip) and
the literal artifact its product resembles (a game top-up token/ticket). No glass,
no neon — flat paper, ink, a rubber stamp, a perforated tear.

Color (named):
  --paper / --paper-2: #F6F1E4 / #EFE8D6   (cream receipt paper, two shades for stripes)
  --card:  #FFFDF6                          (whiter card stock, sits above the paper)
  --ink:   #1C1B19                          (near-black ink — text)
  --ink-soft: #6B6558                       (faded ink — secondary text)
  --stamp: #C0392B                          (red ink-stamp — urgent/danger/badges)
  --bakong:#1E5AA8                          (KHQR/Bakong blue — the one real brand tie, CTA only)
  --paid:  #3F7A4A                          (stamp green — success)
  --line:  #D3CBB4                          (perforation / dashed dividers)

Type: Bebas Neue (display — tall condensed caps, ticket-stub / stamp lettering)
      Archivo (body — grotesk, plain and legible)
      Space Mono (prices, IDs, trx refs — typewriter/receipt-printer feel)
      Kantumruy Pro (Khmer, paired throughout)

Signature element: a torn/perforated edge (zigzag clip-path) on the hero banner and
on the payment sheet's top edge, as if tearing a slip off a receipt roll; game and
product cards get a die-cut "ticket stub" notch (two punched half-circles) at the
seam between image and label, and successful payments get a rotated ink-stamp badge.
-->
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PVH TOPUP</title>
<meta name="description" content="Game top-up Free Fire, Mobile Legends — ទូទាត់ KHQR លឿន សុវត្ថិភាព ដឹកជញ្ជូនស្វ័យប្រវត្តិ">
<meta property="og:title" content="PVH TOPUP">
<meta property="og:description" content="Game top-up Free Fire, Mobile Legends — ទូទាត់ KHQR លឿន សុវត្ថិភាព">
<meta property="og:image" content="/icon-512.png">
<meta property="og:type" content="website">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#1E5AA8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
:root{
  --bg:#F0F4F8;
  --bg-2:#E8EEF5;
  --card:#FFFFFF;
  --ink:#0F172A;
  --ink-soft:#64748B;
  --bakong:#1E5AA8;
  --bakong-dark:#164785;
  --bakong-soft:#E8F0FA;
  --stamp:#E11D48;
  --paid:#059669;
  --paid-soft:#ECFDF5;
  --line:#E2E8F0;
  --line-strong:#CBD5E1;
  --text:var(--ink);
  --muted:var(--ink-soft);
  --gold:var(--stamp);
  --gem:var(--bakong);
  --success:var(--paid);
  --danger:#E11D48;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 4px 16px rgba(15,23,42,.06);
  --shadow-lg:0 12px 40px rgba(15,23,42,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
.icon{display:inline-block; vertical-align:-3px; line-height:0;}
.icon svg{width:1em; height:1em; display:block;}
html,body{margin:0; padding:0; min-height:100%;
  background:linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  color:var(--text); font-family:'Archivo','Kantumruy Pro',sans-serif; overflow-x:hidden;}
h1,h2,h3,.display,.topbar .sitename,footer .fname,.detail-header .gname,.game-card .info .gname,.product-card .pname,.btn-primary,.sheet h3{
  font-family:'Bebas Neue','Kantumruy Pro',sans-serif; letter-spacing:.5px; font-weight:400;}
.mono{font-family:'Space Mono','Kantumruy Pro',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
::-webkit-scrollbar{display:none;}

.facet{position:relative;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.8);
}
.topbar img.logo{height:36px; width:36px; border-radius:10px; object-fit:cover;
  border:none; box-shadow:0 2px 8px rgba(30,90,168,.2);}
.topbar .sitename{font-size:22px; letter-spacing:1px; color:var(--ink); position:relative;}
.topbar .sitename::after{
  content:"KHQR"; position:absolute; top:-7px; right:-34px; font-family:'Space Mono',monospace;
  font-size:8px; font-weight:700; color:#fff; background:var(--bakong);
  border-radius:4px; padding:2px 5px; letter-spacing:.4px;
}
.topbar .spacer{flex:1;}
.topbar .contact-btn{
  display:flex; align-items:center; gap:6px; padding:8px 12px;
  background:var(--bakong-soft); color:var(--bakong); font-size:12.5px; font-weight:700;
  border:none; border-radius:999px;
  transition:background .15s, transform .12s;
}
.topbar .contact-btn:active{transform:scale(.96);}

/* ---------- hero ---------- */
.hero{position:relative; width:100%; aspect-ratio:16/8.4; overflow:hidden;
  background:var(--card); border-radius:0 0 20px 20px;
  box-shadow:var(--shadow);
}
.hero-track{display:flex; height:100%; transition:transform .5s ease;}
.hero-slide{flex:0 0 100%; height:100%;}
.hero-slide img{width:100%; height:100%; object-fit:cover; display:block;}
.hero-dots{position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:6px;}
.hero-dots span{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,.45); transition:all .3s;}
.hero-dots span.active{background:#fff; width:18px; border-radius:4px;}
.hero-empty{display:flex; align-items:center; justify-content:center; gap:6px; height:100%;
  color:var(--muted); font-size:13px; background:var(--bakong-soft);}

/* ---------- promo ---------- */
.promo-strip{display:flex; gap:10px; padding:14px 16px 4px; overflow-x:auto;}
.promo-strip img{height:64px; border-radius:12px; flex:0 0 auto;
  box-shadow:var(--shadow); transition:transform .15s;}
.promo-strip img:active{transform:scale(.97);}

/* ---------- section ---------- */
.section{padding:22px 16px 8px;}
.section h2{font-size:18px; color:var(--ink); font-weight:400; letter-spacing:.8px; margin:0 0 14px;
  display:flex; align-items:center; gap:10px;}
.section h2::before{content:""; width:4px; height:18px; border-radius:2px; background:var(--bakong); flex-shrink:0;}
.section h2::after{content:""; flex:1; height:1px; background:var(--line);}

/* ---------- game grid ---------- */
.game-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 22px;}
@keyframes cardIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.game-card, .product-card, .id-form, .sheet{
  background:var(--card); border:none;
  box-shadow:var(--shadow); border-radius:var(--radius);
}
.game-card{
  position:relative; overflow:hidden;
  display:flex; flex-direction:column;
  animation:cardIn .35s ease both;
  transition:transform .15s, box-shadow .15s;
}
.game-card:nth-child(1){animation-delay:.03s;} .game-card:nth-child(2){animation-delay:.06s;}
.game-card:nth-child(3){animation-delay:.09s;} .game-card:nth-child(4){animation-delay:.12s;}
.game-card:nth-child(n+5){animation-delay:.15s;}
.game-card:active{transform:scale(.98);}
.game-card .media{position:relative; aspect-ratio:1/.85; overflow:hidden; background:var(--bg-2);}
.game-card .media img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s;}
.game-card:active .media img{transform:scale(1.05);}
.game-card .gem-badge{position:absolute; top:10px; right:10px; z-index:2; width:28px; height:28px; border-radius:50%;
  background:var(--bakong); display:flex; align-items:center; justify-content:center;
  color:#fff; border:2px solid #fff; box-shadow:0 2px 8px rgba(30,90,168,.35);}
.game-card .gem-badge svg{width:12px; height:12px;}
.game-card .info{position:relative; z-index:2; padding:12px 12px 14px; background:var(--card);
  display:flex; flex-direction:column; gap:4px;}
.game-card .info::before, .game-card .info::after{display:none;}
.game-card .info .gname{font-size:16px; letter-spacing:.3px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.game-card .info .cta{display:flex; align-items:center; gap:3px; font-size:11px; font-weight:700; color:var(--bakong); text-transform:uppercase; letter-spacing:.3px;}
.game-card .info .cta svg{width:10px; height:10px;}

/* ---------- product detail ---------- */
@keyframes slideInLeft{from{opacity:0; transform:translateX(-12px);} to{opacity:1; transform:translateX(0);}}
.detail-header{display:flex; align-items:center; gap:12px; padding:16px 16px 12px; animation:slideInLeft .3s ease both;}
.back-btn{width:40px; height:40px; border-radius:12px; background:var(--card); border:none;
  display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:var(--shadow); color:var(--ink);}
.detail-header .gname{font-size:22px; letter-spacing:.5px;}

.id-form{margin:0 16px 16px; padding:16px; position:relative; animation:cardIn .3s ease .05s both;}
.id-form label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:8px; font-weight:700;}
.id-row{display:flex; gap:8px; margin-bottom:10px;}
.id-field{position:relative; flex:1;}
.id-field.zone-field{flex:0 0 100px;}
.id-field .field-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; z-index:1;}
.id-field .field-icon svg{width:16px; height:16px;}
.id-row input{width:100%; background:var(--bg); border:1.5px solid var(--line); color:var(--ink);
  padding:12px 12px 12px 36px; border-radius:var(--radius-sm); font-size:14px; font-family:'Space Mono','Kantumruy Pro',monospace; transition:border-color .15s, box-shadow .15s;}
.id-row input:focus{outline:none; border-color:var(--bakong); box-shadow:0 0 0 3px rgba(30,90,168,.15);}
@keyframes statusIn{from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:translateY(0);}}
.id-status{font-size:13px; min-height:18px; padding-top:2px; display:flex; align-items:center; gap:5px; font-weight:600; animation:statusIn .2s ease both;}
.id-status.ok{color:var(--paid);}
.id-status.err{color:var(--stamp);}
.id-status.checking{color:var(--muted);}
.empty-products{grid-column:1/-1; text-align:center; padding:36px 16px; color:var(--muted); font-size:13.5px; display:flex; flex-direction:column; align-items:center; gap:8px;
  border:1.5px dashed var(--line-strong); border-radius:var(--radius); background:var(--card);}
.recent-ids{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.id-chip{display:flex; align-items:center; gap:5px; padding:7px 12px; border-radius:999px; background:var(--bakong-soft);
  border:none; color:var(--bakong); font-size:12px; font-weight:700;}
.id-chip svg{width:12px; height:12px;}

.product-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 18px;}
@keyframes stampPop{0%{opacity:0; transform:scale(.4);} 100%{opacity:1; transform:scale(1);}}
.product-card{
  padding:14px 12px 0; text-align:center; position:relative; overflow:visible;
  animation:cardIn .3s ease both;
  display:flex; flex-direction:column;
  transition:transform .15s, box-shadow .15s;
}
.product-card:nth-child(1){animation-delay:.02s;} .product-card:nth-child(2){animation-delay:.05s;}
.product-card:nth-child(3){animation-delay:.08s;} .product-card:nth-child(4){animation-delay:.11s;}
.product-card:nth-child(n+5){animation-delay:.14s;}
.product-card.selected{box-shadow:0 0 0 2px var(--bakong), var(--shadow-lg);}
.product-card.selected::after{
  animation:stampPop .25s ease both;
  content:"✓"; position:absolute; top:-8px; right:-8px; width:24px; height:24px; border-radius:50%;
  background:var(--bakong); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center;
  justify-content:center; border:2px solid #fff; box-shadow:0 2px 8px rgba(30,90,168,.4);
}
.product-card .badge{position:absolute; top:10px; left:10px; font-size:9.5px; background:var(--stamp); color:#fff;
  padding:4px 8px; font-weight:700; display:flex; align-items:center; gap:3px; border:none;
  border-radius:6px; z-index:2;}
.product-card .badge svg{width:9px; height:9px;}
.product-card .pmedia{width:56px; height:56px; margin:0 auto 8px; border-radius:50%; overflow:hidden;
  background:var(--bakong-soft); border:none;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.product-card .pmedia img{width:100%; height:100%; object-fit:cover; display:block;}
.product-card .pmedia .fallback{color:var(--bakong); opacity:.9;}
.product-card .pmedia .fallback svg{width:22px; height:22px;}
.product-card .pname{font-size:13px; font-weight:600; line-height:1.25; flex:1;
  min-height:2.5em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.product-card .pstub{position:relative; margin:10px -12px 0; padding:10px 12px 12px;
  border-top:1px solid var(--line); background:var(--bg);}
.product-card .pstub::before, .product-card .pstub::after{display:none;}
.product-card .pprice{font-family:'Space Mono','Kantumruy Pro',monospace; color:var(--bakong); font-weight:700; font-size:16px;}

@keyframes barUp{from{opacity:0; transform:translateY(100%);} to{opacity:1; transform:translateY(0);}}
.buy-bar{position:sticky; bottom:0; z-index:40; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.95); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  display:flex; align-items:center; gap:12px; animation:barUp .3s ease both;}
.buy-bar .total .l{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
.buy-bar .total .v{font-family:'Space Mono',monospace; font-size:20px; font-weight:700; color:var(--ink);}
.btn-primary{
  flex:1; background:var(--bakong); color:#fff; font-size:16px; letter-spacing:.5px; padding:14px 24px;
  border-radius:12px; font-weight:400; box-shadow:0 4px 14px rgba(30,90,168,.35);
  transition:background .15s, transform .12s, box-shadow .15s;}
.btn-primary:disabled{opacity:.45; box-shadow:none;}
.btn-primary:not(:disabled):active{transform:scale(.98); background:var(--bakong-dark);}

/* ---------- payment sheet ---------- */
.sheet-backdrop{position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:100;
  display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.sheet{width:100%; max-width:420px; background:var(--card); border-radius:24px 24px 0 0;
  padding:24px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow:var(--shadow-lg);
  animation:sheetUp .3s ease;}
@keyframes sheetUp{from{transform:translateY(100%);} to{transform:translateY(0);}}
.sheet h3{margin:0 0 4px; font-size:22px; text-align:center; letter-spacing:.5px;}
.sheet .sub{text-align:center; color:var(--bakong); font-size:13px; font-weight:700; margin-bottom:16px;
  display:flex; align-items:center; justify-content:center; gap:6px;}
.sheet .sub::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--bakong);}
@keyframes qrPulse{0%,100%{box-shadow:0 0 0 0 rgba(30,90,168,.25);} 50%{box-shadow:0 0 0 8px rgba(30,90,168,0);}}
.qr-frame{background:#fff; padding:14px; margin:0 auto 14px; width:min(220px,68vw);
  border-radius:16px; border:2px solid var(--bakong-soft); animation:qrPulse 2s ease infinite;}
.qr-frame canvas, .qr-frame img{width:100%; height:auto; display:block; border-radius:8px;}
.pay-url-btn{display:block; text-align:center; margin:0 auto 14px; color:var(--bakong); font-size:13px; font-weight:700; text-decoration:underline;}
.pay-amount{text-align:center; font-family:'Space Mono',monospace; font-size:28px; font-weight:700; color:var(--ink); margin-bottom:6px;}
.pay-timer{text-align:center; font-size:13px; color:var(--muted); margin-bottom:14px; font-weight:600;}
.pay-status{text-align:center; padding:12px; border-radius:12px; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;}
.pay-status.waiting{background:var(--bg); color:var(--muted);}
.pay-status.success{background:var(--paid-soft); color:var(--paid);}
.pay-status.processing{background:var(--bakong-soft); color:var(--bakong);}
.pay-status.failed{background:#FEF2F2; color:var(--stamp);}
.close-btn{width:100%; margin-top:14px; padding:13px; border-radius:12px; background:var(--bg); color:var(--ink);
  font-weight:700; font-size:14px;}
.close-btn:active{background:var(--line);}

/* receipt */
.receipt{margin:16px 0; padding:14px; background:var(--bg); border-radius:12px; font-size:13px;}
.receipt-row{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line);}
.receipt-row:last-of-type{border-bottom:none;}
.receipt-row .l{color:var(--muted);}
.receipt-row .v{font-weight:600; font-family:'Space Mono',monospace; font-size:12px;}
.receipt-total{display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:2px solid var(--ink); font-weight:700;}
.receipt-total .v{font-family:'Space Mono',monospace; color:var(--bakong); font-size:16px;}
.giftcard-code-box{margin-top:12px; padding:12px; background:#fff; border-radius:10px; border:1.5px dashed var(--bakong);}
.giftcard-code-box .l{font-size:11px; color:var(--muted); margin-bottom:6px;}
.giftcard-code-box .code-value{font-family:'Space Mono',monospace; font-size:15px; font-weight:700; word-break:break-all; color:var(--ink);}
.copy-receipt-btn{width:100%; margin-top:10px; padding:11px; border-radius:10px; background:var(--bakong); color:#fff; font-weight:700; font-size:13px;}
.copy-receipt-btn.copied{background:var(--paid);}

/* giftcard note */
.giftcard-note{font-size:12.5px; color:var(--bakong); background:var(--bakong-soft); padding:10px 12px; border-radius:10px; margin-bottom:12px; line-height:1.45;}

/* footer */
footer{padding:28px 16px 40px; text-align:center; color:var(--muted); font-size:12.5px; line-height:1.6;}
footer .fname{font-size:18px; color:var(--ink); margin-bottom:6px; letter-spacing:.5px;}
.trust-badge{display:inline-flex; align-items:center; gap:6px; margin:10px 0; padding:8px 14px;
  background:var(--paid-soft); color:var(--paid); border-radius:999px; font-size:12px; font-weight:700;}
.trust-badge svg{width:14px; height:14px;}
.social-row{display:flex; justify-content:center; gap:10px; margin:12px 0;}
.social-link{width:40px; height:40px; border-radius:12px; background:var(--card); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; color:var(--ink);}
.social-link svg{width:18px; height:18px;}
.accept-label{font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; margin:14px 0 8px; color:var(--muted);}
.accept-row{display:flex; justify-content:center; gap:10px; flex-wrap:wrap;}
.accept-badge{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; background:var(--card);
  border-radius:999px; font-size:12px; font-weight:700; color:var(--bakong); box-shadow:var(--shadow);}
.accept-badge img, .accept-badge svg{width:16px; height:16px;}
footer .links{margin:14px 0 8px; display:flex; justify-content:center; gap:16px;}
footer .links a{color:var(--bakong); font-weight:600; font-size:12px;}

/* toast / skeleton / my orders */
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px); background:var(--ink); color:#fff;
  padding:12px 18px; border-radius:12px; font-size:13px; font-weight:600; opacity:0; transition:all .25s; z-index:200; max-width:90vw;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--stamp);}
.skeleton{background:linear-gradient(90deg, var(--bg-2), #fff, var(--bg-2)); background-size:200% 100%;
  animation:shimmer 1.2s infinite; border-radius:12px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

.fade-in-section{opacity:0; transform:translateY(12px); transition:opacity .4s ease, transform .4s ease;}
.fade-in-section.visible{opacity:1; transform:translateY(0);}

/* my orders modal */
.orders-backdrop{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:90; display:flex; align-items:flex-end; justify-content:center;}
.orders-sheet{width:100%; max-width:420px; max-height:80vh; overflow-y:auto; background:var(--card);
  border-radius:24px 24px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom));}
.orders-sheet h3{margin:0 0 12px; font-size:20px;}
.order-item{padding:12px; background:var(--bg); border-radius:12px; margin-bottom:8px; font-size:13px;}
.order-item .row{display:flex; justify-content:space-between; margin-bottom:4px;}
.order-item .mono{font-size:11px; color:var(--muted);}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

// ---- constants shared with the backend (must match server_v11.py) ----
const PAYLOAD_KEY = "uGos5IJrYJWhOedsoAVx6OE+xJpVVArCXYhnQfa4NZU=";
const PAY_TIMEOUT_SECONDS = 300; // 5 min KHQR expiry window

// ---- state ----
let state = {
  view: "home",       // home | game
  games: [],
  banners: [],
  settings: null,
  activeGame: null,
  products: [],
  productsLoading: false,
  selectedProduct: null,
  playerId: "",
  zoneId: "",
  idCheck: null,       // null | "checking" | {ok:true,name} | {ok:false}
  heroIndex: 0,
};

// ---- icon set (inline SVG, stroke-based — no emoji) ----
const ICONS = {
  check: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6"/></svg></span>`,
  cross: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></span>`,
  chat: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>`,
  image: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></span>`,
  star: `<span class="icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17.7l-6.1 3.3 1.5-6.8-5.2-4.7 6.9-.7z"/></svg></span>`,
  chevronLeft: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg></span>`,
  telegram: `<span class="icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21.5 3.5 2.6 10.9c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.8l3-14.1c.3-1.2-.4-1.8-1.7-1.7zM8.6 13.4l9.3-5.9c.4-.3.8-.1.5.2l-8 7.2-.3 3.2-1.5-4.7z"/></svg></span>`,
  facebook: `<span class="icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M14.5 21v-7.6h2.6l.4-3h-3v-1.9c0-.9.2-1.5 1.5-1.5h1.6V4.3c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H9v3h2.4V21z"/></svg></span>`,
  tiktok: `<span class="icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M16.5 3h-2.7v11.6a2.6 2.6 0 1 1-1.9-2.5V9.3a5.5 5.5 0 1 0 4.6 5.4V9.1c1 .7 2.2 1.1 3.5 1.1V7.5c-1.9 0-3.5-1.6-3.5-3.6z"/></svg></span>`,
  user: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M4.5 20c0-3.6 3.4-6.2 7.5-6.2s7.5 2.6 7.5 6.2"/></svg></span>`,
  zone: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 3 20.5 7.8 12 12.6 3.5 7.8"/><polyline points="3.5 12 12 16.8 20.5 12"/><polyline points="3.5 16.2 12 21 20.5 16.2"/></svg></span>`,
  clock: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg></span>`,
  diamond: `<span class="icon"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M4 9l3.2-5h9.6L20 9l-8 11z"/></svg></span>`,
  chevronRight: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></span>`,
  history: `<span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><polyline points="12 8 12 12 15.5 14"/></svg></span>`,
};

// ---- helpers ----
function $(sel, root){ return (root||document).querySelector(sel); }
function vibrate(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms || 10); }catch(e){} } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=> t.classList.remove("show"), 3200);
}
async function api(path, opts){
  opts = opts || {};
  const res = await fetch("/api/" + path, {
    method: opts.method || "GET",
    headers: Object.assign({"Content-Type":"application/json"}, opts.headers||{}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data;
  try { data = await res.json(); } catch(e){ data = {}; }
  return data;
}
function decryptPayload(payloadB64){
  const bytes = CryptoJS.AES.decrypt(payloadB64, PAYLOAD_KEY);
  const text = bytes.toString(CryptoJS.enc.Utf8);
  return JSON.parse(text);
}

// ---- recent Player IDs (localStorage, per game — pure convenience, no server round-trip) ----
const RECENT_IDS_KEY = "pvh_recent_ids_v1";
function loadRecentIds(){
  try{ return JSON.parse(localStorage.getItem(RECENT_IDS_KEY) || "{}"); }catch(e){ return {}; }
}
function saveRecentId(gameCode, playerId, zoneId, name){
  if(!playerId) return;
  const all = loadRecentIds();
  const list = (all[gameCode] || []).filter(e => e.playerId !== playerId);
  list.unshift({ playerId, zoneId: zoneId || "", name: name || "", ts: Date.now() });
  all[gameCode] = list.slice(0, 3);
  try{ localStorage.setItem(RECENT_IDS_KEY, JSON.stringify(all)); }catch(e){}
}
function getRecentIds(gameCode){
  return (loadRecentIds()[gameCode] || []);
}
function lastUsedPlayerIdAnyGame(){
  const all = loadRecentIds();
  let best = null;
  Object.values(all).forEach(list => (list||[]).forEach(e => { if(!best || e.ts > best.ts) best = e; }));
  return best;
}

// ---- data loading ----
async function loadSiteSettings(){
  const r = await api("get-site-settings");
  if(r.success) state.settings = r.settings;
  renderTopbarAndFooter();
}
async function loadHome(){
  const r = await api("get-home-data");
  if(!r.success) { toast("មិនអាចផ្ទុកទិន្នន័យបានទេ", true); return; }
  const payload = decryptPayload(r.payload);
  state.games = payload.games || [];
  state.banners = payload.banners || [];
  render();
  startHeroRotation();
}
async function openGame(game){
  vibrate(8);
  state.activeGame = game;
  state.view = "game";
  state.products = [];
  state.productsLoading = true;
  state.selectedProduct = null;
  const recent = getRecentIds(game.code);
  const last = recent[0];
  state.playerId = last ? last.playerId : "";
  state.zoneId = last ? last.zoneId : "";
  state.idCheck = last ? {ok:true, name:last.name} : null;
  render();
  const r = await api("get-topup-data?id=" + encodeURIComponent(game.code));
  state.productsLoading = false;
  if(!r.success){ toast("មិនអាចផ្ទុក package បានទេ", true); render(); return; }
  const payload = decryptPayload(r.payload);
  state.products = payload.products || [];
  render();
}
function goHome(){
  vibrate(8);
  state.view = "home";
  state.activeGame = null;
  render();
}

// ---- ID validation (debounced) ----
let idCheckTimer = null;
function onIdInput(field, value){
  state[field] = value;
  state.idCheck = null;
  renderIdStatus();
  clearTimeout(idCheckTimer);
  const needsZone = !!state.activeGame.has_server_id;
  if(!state.playerId || (needsZone && !state.zoneId)) return;
  idCheckTimer = setTimeout(checkId, 550);
}
function isTelegramGame(g){
  return !!g && (g.fulfillment_type === "telegram_stars" || g.fulfillment_type === "telegram_premium");
}
async function checkId(){
  if(isTelegramGame(state.activeGame)){
    // Khmer TopUp has no player-name check for Telegram usernames —
    // skip the wasted round-trip and never block checkout on it.
    state.idCheck = null;
    renderIdStatus();
    return;
  }
  state.idCheck = "checking";
  renderIdStatus();
  const r = await api("check-user", {method:"POST", body:{
    gameCode: state.activeGame.code, userId: state.playerId, zoneId: state.zoneId || undefined,
  }});
  if(r.success && r.name){
    state.idCheck = {ok:true, name:r.name};
    saveRecentId(state.activeGame.code, state.playerId, state.zoneId, r.name);
  } else if(r.success && r.name === null){
    state.idCheck = null; // auto-check unavailable server-side, don't block checkout
  } else {
    state.idCheck = {ok:false};
  }
  renderIdStatus();
}
function renderIdStatus(){
  const el = $("#idStatus");
  if(!el) return;
  if(state.idCheck === "checking"){ el.textContent = "កំពុងឆែក ID..."; el.className = "id-status checking"; }
  else if(state.idCheck && state.idCheck.ok){ el.innerHTML = ICONS.check + " " + ICONS.user + " " + esc(state.idCheck.name); el.className = "id-status ok"; }
  else if(state.idCheck && !state.idCheck.ok){
    const label = isTelegramGame(state.activeGame) ? "រកមិនឃើញគណនី Telegram" : "រកមិនឃើញ Player ID";
    el.innerHTML = ICONS.cross + " " + label; el.className = "id-status err";
  }
  else { el.textContent = ""; el.className = "id-status"; }
  updateBuyBarState();
}

// ---- product selection ----
function useRecentId(playerId, zoneId, name){
  vibrate(8);
  state.playerId = playerId;
  state.zoneId = zoneId || "";
  state.idCheck = {ok:true, name: name || ""};
  render();
}

// ---- My Orders (order history lookup by player ID) ----
function openMyOrders(){
  vibrate(8);
  const root = document.createElement("div");
  root.className = "sheet-backdrop";
  root.id = "ordersSheet";
  const prefill = lastUsedPlayerIdAnyGame();
  root.innerHTML = `
    <div class="sheet">
      <h3>ការបញ្ជាទិញរបស់ខ្ញុំ</h3>
      <div class="sub">វាយ Player ID ដើម្បីមើលប្រវត្តិទិញ</div>
      <div class="id-row">
        <div class="id-field">
          <span class="field-icon">${ICONS.user}</span>
          <input type="text" inputmode="numeric" id="ordersSearchInput" placeholder="Player ID" value="${esc(prefill ? prefill.playerId : "")}">
        </div>
        <button class="btn-primary" style="padding:11px 18px" onclick="__app.searchMyOrders()">ស្វែងរក</button>
      </div>
      <div id="ordersResult"></div>
      <button class="close-btn" onclick="__app.closeMyOrders()">បិទ</button>
    </div>`;
  document.body.appendChild(root);
  if(prefill) searchMyOrders();
}
function closeMyOrders(){
  const el = $("#ordersSheet");
  if(el) el.remove();
}
async function searchMyOrders(){
  const input = $("#ordersSearchInput");
  const userId = input ? input.value.trim() : "";
  const resultEl = $("#ordersResult");
  if(!userId){ toast("សូមវាយ Player ID", true); return; }
  resultEl.innerHTML = `<div class="skeleton" style="height:60px;border-radius:10px;margin-top:12px;"></div>`;
  const r = await api("my-orders?userId=" + encodeURIComponent(userId));
  if(!r.success){ resultEl.innerHTML = `<div class="empty-products">${ICONS.cross} មិនអាចផ្ទុកបានទេ</div>`; return; }
  if(!r.orders.length){ resultEl.innerHTML = `<div class="empty-products">${ICONS.image} មិនទាន់មានការបញ្ជាទិញសម្រាប់ ID នេះទេ</div>`; return; }
  resultEl.innerHTML = r.orders.map(o => `
    <div class="receipt" style="margin-top:12px">
      <div class="receipt-row"><span class="l">Trx ID</span><span class="v">${esc(o.trx_id)}</span></div>
      <div class="receipt-row"><span class="l">ថ្ងៃ</span><span class="v">${esc(fmtDateTime(o.paid_at || o.created_at))}</span></div>
      <div class="receipt-row"><span class="l">ហ្គេម / Package</span><span class="v">${esc(o.game_name)} / ${esc(o.product_name)}</span></div>
      <div class="receipt-row"><span class="l">ស្ថានភាព</span><span class="v">${o.status === "paid" ? esc(deliveryStatusLabel(o.delivery_status)) : "មិនទាន់បង់ប្រាក់"}</span></div>
      <div class="receipt-total"><span>តម្លៃ</span><span class="v">$${Number(o.amount).toFixed(2)}</span></div>
      ${o.delivery_code ? `<div class="giftcard-code-box"><div class="l">${ICONS.image} Gift Card Code</div><div class="code-value">${esc(o.delivery_code)}</div></div>` : ""}
    </div>`).join("");
}

function selectProduct(id){
  vibrate(8);
  state.selectedProduct = state.products.find(p => p.id === id) || null;
  render();
}
function updateBuyBarState(){
  const btn = $("#buyBtn");
  if(!btn) return;
  const g = state.activeGame;
  if(g && g.fulfillment_type === "giftcard"){
    btn.disabled = !state.selectedProduct;
    return;
  }
  const needsZone = !!(g && g.has_server_id);
  const ready = state.selectedProduct && state.playerId && (!needsZone || state.zoneId) && !(state.idCheck && state.idCheck.ok === false);
  btn.disabled = !ready;
}

// ---- checkout / payment ----
let pollPayTimer = null, pollTopupTimer = null, countdownTimer = null;

async function buyNow(){
  if(!state.selectedProduct) return;
  vibrate(14);
  const amount = Number(state.selectedProduct.price);
  const userId = state.playerId;

  const btn = $("#buyBtn");
  if(btn){ btn.disabled = true; btn.textContent = "កំពុងបង្កើត QR..."; }

  const r = await api("create-payment", {
    method:"POST",
    body:{userId, zoneId: state.zoneId || "", gameCode: state.activeGame.code, productId: state.selectedProduct.id},
  });

  if(!r.success){
    toast(r.error || "បង្កើត QR មិនជោគជ័យ", true);
    if(btn){ btn.disabled = false; btn.textContent = "ទិញឥឡូវ"; }
    return;
  }
  openPaymentSheet(r.trx_id, r.qr_image, r.pay_url, amount);
}

function openPaymentSheet(trxId, qrImage, payUrl, amount){
  let secondsLeft = PAY_TIMEOUT_SECONDS;
  const root = document.createElement("div");
  root.className = "sheet-backdrop";
  root.id = "paySheet";
  root.innerHTML = `
    <div class="sheet">
      <h3>ស្កេន QR ដើម្បីទូទាត់</h3>
      <div class="sub">Bakong KHQR · ធនាគារណាក៏បាន</div>
      <div class="qr-frame" id="qrFrame">${qrImage ? `<img src="${qrImage}" alt="Bakong KHQR QR">` : ""}</div>
      ${payUrl ? `<a class="pay-url-btn" href="${payUrl}" target="_blank" rel="noopener">បើកទំព័រទូទាត់</a>` : ""}
      <div class="pay-amount">$${amount.toFixed(2)}</div>
      <div class="pay-timer" id="payTimer">នៅសល់ 05:00</div>
      <div class="pay-status waiting" id="payStatus">កំពុងរង់ចាំការទូទាត់...</div>
      <button class="close-btn" id="closeSheetBtn">បិទ</button>
    </div>`;
  document.body.appendChild(root);

  $("#closeSheetBtn").onclick = () => closePaymentSheet(trxId, true);

  countdownTimer = setInterval(() => {
    secondsLeft--;
    const m = String(Math.floor(secondsLeft/60)).padStart(2,"0");
    const s = String(secondsLeft%60).padStart(2,"0");
    const timerEl = $("#payTimer");
    if(timerEl) timerEl.textContent = `នៅសល់ ${m}:${s}`;
    if(secondsLeft <= 0){
      clearInterval(countdownTimer);
      api("expire-payment", {method:"POST", body:{trx_id: trxId}});
      setPayStatus("failed", "QR ផុតកំណត់ — សូមចាប់ផ្តើមម្តងទៀត");
      clearInterval(pollPayTimer);
    }
  }, 1000);

  pollPayTimer = setInterval(async () => {
    const r = await api("check-payment", {method:"POST", body:{trx_id: trxId}});
    if(r.paid){
      clearInterval(pollPayTimer);
      clearInterval(countdownTimer);
      const ds = (r.data && r.data.delivery_status) || null;
      handleDeliveryStatus(trxId, ds, r.data || null);
    } else if(r.expired){
      clearInterval(pollPayTimer);
      clearInterval(countdownTimer);
      setPayStatus("failed", "QR ផុតកំណត់ — សូមចាប់ផ្តើមម្តងទៀត");
    }
  }, 3000);
}

function setPayStatus(kind, html){
  const el = $("#payStatus");
  if(!el) return;
  el.className = "pay-status " + kind;
  el.innerHTML = html;
}

function fmtDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "—";
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function deliveryStatusLabel(ds){
  if(ds === "delivered") return "✓ បានបញ្ជូនស្វ័យប្រវត្តិ";
  if(ds === "processing") return "កំពុងបញ្ជូន";
  if(ds === "failed") return "បញ្ជូនមិនកើត — ត្រូវការ manual";
  return "រង់ចាំ admin បញ្ជូន";
}
function receiptText(order, trxId){
  const g = state.activeGame, p = state.selectedProduct;
  const isGiftcard = g && g.fulfillment_type === "giftcard";
  const idLine = isTelegramGame(g) ? "Telegram Username" : "Player ID";
  const lines = [
    `វិក័យប័ត្រ PVH TOPUP`,
    `Trx ID: ${trxId}`,
    `ថ្ងៃ: ${fmtDateTime(order.paid_at || order.created_at)}`,
    `ហ្គេម: ${g ? g.name : order.game_code}`,
    `Package: ${p ? p.name : ""}`,
  ];
  if(!isGiftcard) lines.push(`${idLine}: ${order.user_id}${order.zone_id ? " ("+order.zone_id+")" : ""}`);
  lines.push(`តម្លៃ: $${Number(order.amount).toFixed(2)}`);
  lines.push(`ស្ថានភាព: ${deliveryStatusLabel(order.delivery_status)}`);
  if(order.delivery_code) lines.push(`Gift Card Code: ${order.delivery_code}`);
  return lines.join("\n");
}
function renderReceipt(order, trxId){
  const sheetEl = $("#paySheet .sheet");
  if(!sheetEl) return;
  const g = state.activeGame, p = state.selectedProduct;
  const old = $("#receiptBlock");
  if(old) old.remove();
  const isGiftcard = g && g.fulfillment_type === "giftcard";
  const idLabel = isTelegramGame(g) ? "Telegram Username" : "Player ID";
  const block = document.createElement("div");
  block.className = "receipt";
  block.id = "receiptBlock";
  block.innerHTML = `
    <div class="receipt-row"><span class="l">Trx ID</span><span class="v">${esc(trxId)}</span></div>
    <div class="receipt-row"><span class="l">ថ្ងៃ</span><span class="v">${esc(fmtDateTime(order.paid_at || order.created_at))}</span></div>
    <div class="receipt-row"><span class="l">ហ្គេម</span><span class="v">${esc(g ? g.name : order.game_code)}</span></div>
    <div class="receipt-row"><span class="l">Package</span><span class="v">${esc(p ? p.name : "")}</span></div>
    ${isGiftcard ? "" : `<div class="receipt-row"><span class="l">${idLabel}</span><span class="v">${esc(order.user_id)}${order.zone_id ? " ("+esc(order.zone_id)+")" : ""}</span></div>`}
    <div class="receipt-row"><span class="l">ស្ថានភាព</span><span class="v">${esc(deliveryStatusLabel(order.delivery_status))}</span></div>
    <div class="receipt-total"><span>សរុប</span><span class="v">$${Number(order.amount).toFixed(2)}</span></div>
    ${order.delivery_code ? `
      <div class="giftcard-code-box">
        <div class="l">${ICONS.image} Gift Card Code — redeem លើ roblox.com</div>
        <div class="code-value" id="giftcardCodeValue">${esc(order.delivery_code)}</div>
      </div>
      <button class="copy-receipt-btn" id="copyCodeBtn">${ICONS.check} ចម្លង Code</button>
    ` : ""}
    <button class="copy-receipt-btn" id="copyReceiptBtn">${ICONS.chat} ចម្លងវិក័យប័ត្រ</button>
  `;
  sheetEl.insertBefore(block, $("#closeSheetBtn"));
  if(order.delivery_code){
    $("#copyCodeBtn").onclick = async () => {
      const btn = $("#copyCodeBtn");
      try{
        await navigator.clipboard.writeText(order.delivery_code);
        btn.classList.add("copied");
        btn.innerHTML = `${ICONS.check} បានចម្លង Code!`;
        setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = `${ICONS.check} ចម្លង Code`; }, 2000);
      }catch(e){ toast("មិនអាចចម្លងបានទេ", true); }
    };
  }
  $("#copyReceiptBtn").onclick = async () => {
    const btn = $("#copyReceiptBtn");
    try{
      await navigator.clipboard.writeText(receiptText(order, trxId));
      btn.classList.add("copied");
      btn.innerHTML = `${ICONS.check} បានចម្លង!`;
      setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = `${ICONS.chat} ចម្លងវិក័យប័ត្រ`; }, 2000);
    }catch(e){ toast("មិនអាចចម្លងបានទេ", true); }
  };
}

function handleDeliveryStatus(trxId, ds, order){
  if(ds === "delivered"){
    setPayStatus("success", ICONS.check + " ទូទាត់ជោគជ័យ — ទទួល Diamond ដោយស្វ័យប្រវត្តិ!");
  } else if(ds === "processing"){
    setPayStatus("processing", ICONS.clock + " កំពុងបញ្ជូន Diamond ស្វ័យប្រវត្តិ...");
    pollTopupTimer = setInterval(async () => {
      const r = await api("check-topup-status", {method:"POST", body:{trx_id: trxId}});
      if(r.delivery_status === "delivered"){
        clearInterval(pollTopupTimer);
        setPayStatus("success", ICONS.check + " ទូទាត់ជោគជ័យ — ទទួល Diamond ដោយស្វ័យប្រវត្តិ!");
        if(order){ order.delivery_status = "delivered"; renderReceipt(order, trxId); }
      } else if(r.delivery_status === "failed"){
        clearInterval(pollTopupTimer);
        setPayStatus("failed", "ទូទាត់ជោគជ័យ ប៉ុន្តែបញ្ជូនស្វ័យប្រវត្តិមិនកើត — ទាក់ទង admin ខាងក្រោម");
        if(order){ order.delivery_status = "failed"; renderReceipt(order, trxId); }
      }
    }, 4000);
  } else if(ds === "failed"){
    setPayStatus("failed", "ទូទាត់ជោគជ័យ ប៉ុន្តែបញ្ជូនស្វ័យប្រវត្តិមិនកើត — ទាក់ទង admin ខាងក្រោម");
  } else {
    setPayStatus("success", ICONS.check + " ទូទាត់ជោគជ័យ — admin នឹងបញ្ជូនជូនក្នុងពេលឆាប់ៗ");
  }
  if(order) renderReceipt(order, trxId);
}

function closePaymentSheet(trxId, userClosed){
  clearInterval(pollPayTimer); clearInterval(pollTopupTimer); clearInterval(countdownTimer);
  const el = $("#paySheet");
  if(el) el.remove();
  const btn = $("#buyBtn");
  if(btn){ btn.disabled = false; btn.textContent = "ទិញឥឡូវ"; }
  if(userClosed && trxId) api("expire-payment", {method:"POST", body:{trx_id: trxId}}).catch(()=>{});
}

// ---- hero rotation ----
let heroTimer = null;
function startHeroRotation(){
  clearInterval(heroTimer);
  const slides = (state.banners||[]).filter(b => b.type === "main_slider");
  if(slides.length < 2) return;
  heroTimer = setInterval(() => {
    state.heroIndex = (state.heroIndex + 1) % slides.length;
    const track = $("#heroTrack");
    if(track) track.style.transform = `translateX(-${state.heroIndex*100}%)`;
    document.querySelectorAll(".hero-dots span").forEach((d,i)=>d.classList.toggle("active", i===state.heroIndex));
  }, 4000);
}

// ---- micro-interactions: reveal sections as they scroll into view ----
let revealObserver = null;
function initScrollReveal(){
  if(!("IntersectionObserver" in window)) return;
  if(!revealObserver){
    revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add("visible");
          revealObserver.unobserve(entry.target);
        }
      });
    }, {threshold:0.12, rootMargin:"0px 0px -40px 0px"});
  }
  const targets = document.querySelectorAll(
    "#main .section, #main .game-grid, #main .product-grid, #main .id-form, #main .hero, #main .promo-strip, #main .detail-header"
  );
  targets.forEach(el => {
    if(!el.classList.contains("fade-in-section")){
      el.classList.add("fade-in-section");
      revealObserver.observe(el);
    }
  });
}

function renderHeroAndPromo(){

    <div class="hero">
      <div class="hero-track" id="heroTrack">
        ${mainSlides.map(b => `<div class="hero-slide"><img src="${esc(b.image_url)}" alt=""></div>`).join("")}
      </div>
      ${mainSlides.length>1 ? `<div class="hero-dots">${mainSlides.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join("")}</div>` : ""}
