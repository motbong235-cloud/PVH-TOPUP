<!--
DESIGN — PVH TOPUP inspired by sazztopup.top
Dark iOS shop: #0b0e14 bg, purple accent #8b5cf6, 3-col game icons,
search bar, bottom tab bar. Payment = Bakong KHQR.
Fonts: Plus Jakarta Sans + Kantumruy Pro.
-->
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PVH TOPUP</title>
<meta name="description" content="Game top-up Free Fire, Mobile Legends — ទូទាត់ KHQR លឿន សុវត្ថិភាព ដឹកជញ្ជូនស្វ័យប្រវត្តិ">
<meta property="og:title" content="PVH TOPUP">
<meta property="og:description" content="Game top-up Free Fire, Mobile Legends — ទូទាត់ KHQR លឿន សុវត្ថិភាព">
<meta property="og:image" content="/icon-512.png">
<meta property="og:type" content="website">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#0b0e14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Kantumruy+Pro:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
:root{
  --bg:#0b0e14;
  --bg2:#121520;
  --card:#181c27;
  --card-2:#1e2433;
  --ink:#f0f2f7;
  --ink-soft:#8b93a7;
  --acc:#8b5cf6;
  --acc-600:#7c3aed;
  --acc-soft:rgba(139,92,246,.16);
  --bakong:#8b5cf6;
  --bakong-bright:#a78bfa;
  --bakong-dark:#7c3aed;
  --bakong-glow:rgba(139,92,246,.35);
  --bakong-soft:rgba(139,92,246,.14);
  --stamp:#ef4444;
  --paid:#22c55e;
  --paid-soft:rgba(34,197,94,.12);
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.14);
  --text:var(--ink);
  --muted:var(--ink-soft);
  --gold:var(--stamp);
  --gem:var(--acc);
  --success:var(--paid);
  --danger:#ef4444;
  --radius:16px;
  --radius-sm:12px;
  --tab-h:56px;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 8px 24px rgba(0,0,0,.45);
  --fd:'Plus Jakarta Sans','Kantumruy Pro',system-ui,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
.icon{display:inline-block; vertical-align:-3px; line-height:0;}
.icon svg{width:1em; height:1em; display:block;}
html,body{margin:0; padding:0; min-height:100%;
  background:var(--bg); color:var(--text);
  font-family:var(--fd); overflow-x:hidden; color-scheme:dark;}
h1,h2,h3,.display,.topbar .sitename,footer .fname,.detail-header .gname,.game-card .info .gname,.product-card .pname,.btn-primary,.sheet h3{
  font-family:var(--fd); letter-spacing:-.02em; font-weight:700;}
.mono{font-family:'Space Mono',ui-monospace,monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
::-webkit-scrollbar{display:none;}
.facet{position:relative;}

/* topbar */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:10px;
  padding:10px 14px;
  background:rgba(11,14,20,.88);
  backdrop-filter:saturate(160%) blur(14px); -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:.5px solid var(--line);
}
.topbar img.logo{height:34px; width:34px; border-radius:10px; object-fit:cover;
  box-shadow:0 0 0 1.5px var(--acc-soft), 0 4px 12px var(--bakong-glow);}
.topbar .sitename{font-size:16px; font-weight:800; letter-spacing:-.02em; color:#fff; position:relative;}
.topbar .sitename::after{
  content:"KHQR"; position:absolute; top:-8px; right:-34px;
  font-family:var(--fd); font-size:8px; font-weight:800;
  color:#fff; background:linear-gradient(135deg, var(--acc), #ec4899);
  border-radius:5px; padding:2px 5px; letter-spacing:.3px;
}
.topbar .spacer{flex:1;}
.topbar .contact-btn{
  display:flex; align-items:center; gap:5px; padding:8px 12px; min-height:36px;
  background:var(--acc-soft); color:var(--bakong-bright); font-size:12px; font-weight:700;
  border:1px solid rgba(139,92,246,.25); border-radius:999px;
}
.topbar .contact-btn:active{transform:scale(.96);}

/* hero banner */
.hero{position:relative; width:calc(100% - 28px); margin:12px 14px 0; aspect-ratio:16/6.5; overflow:hidden;
  background:var(--card); border-radius:14px; box-shadow:var(--shadow);}
.hero-track{display:flex; height:100%; transition:transform .5s ease;}
.hero-slide{flex:0 0 100%; height:100%;}
.hero-slide img{width:100%; height:100%; object-fit:cover; display:block;}
.hero-dots{position:absolute; bottom:10px; left:0; right:0; display:flex; justify-content:center; gap:5px;}
.hero-dots span{width:5px; height:5px; border-radius:50%; background:rgba(255,255,255,.3);}
.hero-dots span.active{background:var(--acc); width:14px; border-radius:3px;}
.hero-empty{display:flex; align-items:center; justify-content:center; height:100%; color:var(--muted); font-size:13px; background:var(--card-2);}

/* search */
.home-search{margin:14px 14px 8px; display:flex; align-items:center; gap:8px;
  background:var(--card); border:.5px solid var(--line); border-radius:12px; padding:10px 14px;}
.home-search .ic{color:var(--muted); flex:none;}
.home-search .ic svg{width:16px; height:16px;}
.home-search input{flex:1; background:transparent; border:0; outline:0; color:#fff; font-size:14px; font-family:var(--fd);}
.home-search input::placeholder{color:var(--muted);}

/* promo */
.promo-strip{display:flex; gap:8px; padding:8px 14px; overflow-x:auto;}
.promo-strip img{height:56px; border-radius:10px; flex:0 0 auto; border:.5px solid var(--line);}

/* section */
.section{padding:14px 14px 4px;}
.section h2{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  color:var(--muted); margin:0 0 10px; display:flex; align-items:center; gap:6px;}
.section h2::before{content:"🔥"; font-size:13px;}
.section h2::after{display:none;}

/* 3-col game grid — Sazz style */
.game-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 10px; padding:0 14px 24px;}
@keyframes cardIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.game-card{
  background:transparent; border:0; box-shadow:none; border-radius:0;
  display:flex; flex-direction:column; gap:6px; align-items:center;
  animation:cardIn .3s ease both; padding:0;
}
.game-card:nth-child(1){animation-delay:.02s;} .game-card:nth-child(2){animation-delay:.04s;}
.game-card:nth-child(3){animation-delay:.06s;} .game-card:nth-child(4){animation-delay:.08s;}
.game-card:nth-child(n+5){animation-delay:.1s;}
.game-card:active{opacity:.85;}
.game-card .media{width:100%; aspect-ratio:1; border-radius:16px; overflow:hidden;
  background:var(--card-2); box-shadow:0 2px 10px rgba(0,0,0,.35); position:relative;}
.game-card .media img{width:100%; height:100%; object-fit:cover; display:block;}
.game-card .gem-badge{position:absolute; top:6px; left:6px; z-index:2;
  background:linear-gradient(135deg,#ef4444,#f97316); color:#fff;
  font-size:9px; font-weight:800; padding:3px 6px; border-radius:6px;
  display:flex; align-items:center; gap:2px; border:0; width:auto; height:auto;
  box-shadow:0 2px 6px rgba(239,68,68,.4);}
.game-card .gem-badge svg{width:9px; height:9px;}
.game-card .info{padding:0; width:100%; text-align:center; background:transparent; border:0; box-shadow:none;}
.game-card .info::before, .game-card .info::after{display:none;}
.game-card .info .gname{font-size:11px; font-weight:650; letter-spacing:-.01em; line-height:1.25;
  color:#e8eaf0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  white-space:normal; text-overflow:ellipsis;}
.game-card .info .cta{display:none;}

.product-card, .id-form, .sheet{
  background:var(--card); border:.5px solid var(--line);
  box-shadow:var(--shadow); border-radius:var(--radius);
}

/* detail */
.detail-header{display:flex; align-items:center; gap:10px; padding:12px 14px 8px;}
.back-btn{width:40px; height:40px; min-width:40px; min-height:40px; border-radius:12px;
  background:var(--card); border:.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:16px; color:#fff;}
.detail-header .gname{font-size:17px; font-weight:750; color:#fff;}

.id-form{margin:0 14px 12px; padding:14px;}
.id-form label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:8px; font-weight:700;}
.id-row{display:flex; gap:8px; margin-bottom:8px;}
.id-field{position:relative; flex:1;}
.id-field.zone-field{flex:0 0 96px;}
.id-field .field-icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; z-index:1;}
.id-field .field-icon svg{width:15px; height:15px;}
.id-row input{width:100%; background:var(--bg); border:.5px solid var(--line-strong); color:#fff;
  padding:13px 12px 13px 36px; border-radius:10px; font-size:16px; min-height:46px;
  font-family:var(--fd); transition:border-color .15s, box-shadow .15s;}
.id-row input:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 3px var(--bakong-glow);}
.id-row input::placeholder{color:rgba(139,147,167,.55);}
.id-status{font-size:12.5px; min-height:18px; padding-top:2px; display:flex; align-items:center; gap:5px; font-weight:600;}
.id-status.ok{color:var(--paid);}
.id-status.err{color:var(--stamp);}
.id-status.checking{color:var(--muted);}
.empty-products{grid-column:1/-1; text-align:center; padding:32px 14px; color:var(--muted); font-size:13px;
  border:1px dashed var(--line-strong); border-radius:12px; background:var(--card);}
.recent-ids{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.id-chip{display:flex; align-items:center; gap:4px; padding:6px 11px; border-radius:999px;
  background:var(--acc-soft); border:1px solid rgba(139,92,246,.25);
  color:var(--bakong-bright); font-size:11.5px; font-weight:700;}
.id-chip svg{width:11px; height:11px;}

/* products 2-col */
.product-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 14px 110px;}
.product-card{
  padding:12px 10px 0; text-align:center; position:relative;
  display:flex; flex-direction:column; animation:cardIn .25s ease both;
}
.product-card.selected{
  border-color:var(--acc);
  box-shadow:0 0 0 1px var(--acc), 0 6px 20px var(--bakong-glow);
}
.product-card.selected::after{
  content:"✓"; position:absolute; top:-7px; right:-7px; width:22px; height:22px; border-radius:50%;
  background:linear-gradient(135deg, var(--acc), #ec4899); color:#fff; font-size:11px; font-weight:800;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--bg);
}
.product-card .badge{position:absolute; top:8px; left:8px; font-size:9px;
  background:linear-gradient(135deg,#ef4444,#f97316); color:#fff;
  padding:3px 7px; font-weight:800; border-radius:6px; z-index:2;}
.product-card .pmedia{width:48px; height:48px; margin:0 auto 6px; border-radius:50%; overflow:hidden;
  background:var(--acc-soft); display:flex; align-items:center; justify-content:center;}
.product-card .pmedia img{width:100%; height:100%; object-fit:cover;}
.product-card .pmedia .fallback{color:var(--bakong-bright);}
.product-card .pmedia .fallback svg{width:20px; height:20px;}
.product-card .pname{font-size:12.5px; font-weight:650; line-height:1.25; flex:1; color:#e2e8f0;
  min-height:2.4em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.product-card .pstub{margin:8px -10px 0; padding:9px 10px 11px; border-top:.5px solid var(--line);
  background:rgba(139,92,246,.06);}
.product-card .pstub::before, .product-card .pstub::after{display:none;}
.product-card .pprice{font-family:var(--fd); color:var(--bakong-bright); font-weight:800; font-size:15px;}

/* buy bar */
.buy-bar{position:sticky; bottom:calc(var(--tab-h) + env(safe-area-inset-bottom)); z-index:40;
  padding:10px 14px 10px;
  background:rgba(11,14,20,.94); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:.5px solid var(--line);
  display:flex; align-items:flex-end; gap:10px;}
.buy-bar .total .l{font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.buy-bar .total .v{font-family:var(--fd); font-size:18px; font-weight:800; color:#fff;}
.buy-actions{flex:1; display:flex; flex-direction:column; min-width:0;}
.buy-hint{font-size:11px; color:var(--muted); margin-top:4px; text-align:center; min-height:14px; font-weight:600;}
.btn-primary{
  flex:1; width:100%; background:linear-gradient(135deg, var(--acc), #ec4899); color:#fff;
  font-size:15px; font-weight:750; letter-spacing:-.01em; padding:13px 20px; min-height:48px;
  border-radius:12px; box-shadow:0 4px 16px var(--bakong-glow);}
.btn-primary:disabled{opacity:.38; box-shadow:none; filter:none;}
.btn-primary:not(:disabled):active{transform:scale(.98);}

/* payment sheet */
/* payment sheet — ABA/Bakong KHQR card style (like sazztopup) */
.sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:100;
  display:flex; align-items:flex-end; justify-content:center; padding:0;}
.sheet.khqr-card{
  width:100%; max-width:420px;
  background:#fff; color:#1a1d26;
  border:0; border-radius:18px 18px 0 0;
  padding:0 0 calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 40px rgba(0,0,0,.45);
  overflow:hidden;
}
.khqr-head{
  background:#E31C23;
  padding:16px 16px 18px; text-align:center; position:relative;
  clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%);
}
.khqr-head .khqr-logo{
  font-family:var(--fd); font-weight:800; font-size:22px; letter-spacing:.04em;
  color:#fff; display:inline-flex; align-items:center; gap:2px;
}
.khqr-head .khqr-logo span{opacity:.95;}
.khqr-body{padding:8px 20px 8px; text-align:center;}
.khqr-meta{display:flex; justify-content:space-between; align-items:center;
  padding:4px 0 10px; font-size:13px; font-weight:700; color:#4b5563;}
.khqr-meta .tag{color:#1f2937;}
.khqr-meta .timer{display:inline-flex; align-items:center; gap:6px; color:#6b7280; font-variant-numeric:tabular-nums;}
.khqr-meta .timer .dot{
  width:14px; height:14px; border:2px solid #93c5fd; border-top-color:#3b82f6;
  border-radius:50%; animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.khqr-merchant{font-size:13px; color:#9ca3af; font-weight:600; letter-spacing:.04em;
  text-transform:uppercase; margin:4px 0 2px;}
.khqr-amount{font-family:var(--fd); font-size:32px; font-weight:800; color:#111827; margin:0 0 4px;}
.khqr-amount small{font-size:14px; font-weight:700; color:#6b7280; margin-left:4px;}
.khqr-divider{border:0; border-top:1px dashed #e5e7eb; margin:12px 0 16px;}
.qr-frame{
  background:#fff; padding:0; margin:0 auto 14px; width:min(220px,68vw);
  border-radius:0; position:relative; display:inline-block;
}
.qr-frame img, .qr-frame canvas{width:100%; height:auto; display:block; border-radius:0;}
.qr-frame .qr-dollar{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:36px; height:36px; border-radius:50%; background:#fff;
  border:2px solid #111; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:18px; color:#111; pointer-events:none;
  box-shadow:0 0 0 3px #fff;
}
.khqr-scan{font-size:16px; font-weight:800; color:#1e3a5f; margin:6px 0 4px;}
.khqr-or{font-size:12px; color:#9ca3af; margin:2px 0 6px;}
.khqr-dl{
  display:inline-flex; align-items:center; gap:6px;
  color:#22d3ee; font-size:14px; font-weight:700; background:none; border:0;
  padding:8px 12px; cursor:pointer; font-family:var(--fd);
}
.khqr-dl:active{opacity:.7;}
.khqr-hint{font-size:12px; color:#9ca3af; line-height:1.45; margin:4px 16px 12px; text-align:center;}
.pay-status{text-align:center; margin:0 16px 10px; padding:11px; border-radius:10px; font-size:13px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:6px;}
.pay-status.waiting{background:#f3f4f6; color:#6b7280;}
.pay-status.success{background:#ecfdf5; color:#059669;}
.pay-status.processing{background:#eff6ff; color:#2563eb;}
.pay-status.failed{background:#fef2f2; color:#dc2626;}
.close-btn{width:calc(100% - 32px); margin:4px 16px 8px; padding:13px; min-height:46px; border-radius:12px;
  background:#f3f4f6; color:#4b5563; font-weight:700; font-size:14px; border:0;}
.close-btn:active{background:#e5e7eb;}
.sheet.khqr-card .receipt{margin:10px 16px; background:#f9fafb; border:1px solid #e5e7eb; color:#111;}
.sheet.khqr-card .receipt-row .l{color:#6b7280;}
.sheet.khqr-card .receipt-row .v{color:#111;}
.sheet.khqr-card .receipt-total{color:#111;}
.sheet.khqr-card .receipt-total .v{color:#7c3aed;}
.sheet.khqr-card .post-pay-actions{margin:10px 16px 4px;}
.sheet.khqr-card .copy-receipt-btn{background:linear-gradient(135deg,#8b5cf6,#ec4899);}
.pay-url-btn{display:none;}


.receipt{margin:14px 0; padding:12px; background:var(--bg2); border-radius:12px; font-size:12.5px; border:.5px solid var(--line);}
.receipt-row{display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed var(--line);}
.receipt-row:last-of-type{border-bottom:none;}
.receipt-row .l{color:var(--muted);}
.receipt-row .v{font-weight:650; font-family:var(--fd); font-size:12px; color:#e2e8f0;}
.receipt-total{display:flex; justify-content:space-between; margin-top:8px; padding-top:8px; border-top:1px solid var(--line-strong); font-weight:800; color:#fff;}
.receipt-total .v{font-family:var(--fd); color:var(--bakong-bright); font-size:15px;}
.giftcard-code-box{margin-top:10px; padding:10px; background:var(--bg); border-radius:10px; border:1.5px dashed var(--acc);}
.giftcard-code-box .l{font-size:11px; color:var(--muted); margin-bottom:5px;}
.giftcard-code-box .code-value{font-family:ui-monospace,monospace; font-size:14px; font-weight:700; word-break:break-all; color:#fff;}
.copy-receipt-btn{width:100%; margin-top:8px; padding:11px; border-radius:10px;
  background:linear-gradient(135deg, var(--acc), #ec4899); color:#fff; font-weight:700; font-size:13px;}
.copy-receipt-btn.copied{background:var(--paid);}
.giftcard-note{font-size:12px; color:var(--bakong-bright); background:var(--acc-soft);
  padding:10px 12px; border-radius:10px; margin-bottom:10px; line-height:1.45; border:1px solid rgba(139,92,246,.2);}

.post-pay-actions{display:flex; flex-direction:column; gap:8px; margin:12px 0 4px;}
.post-pay-btn{width:100%; padding:13px; min-height:46px; border-radius:12px; font-weight:700; font-size:14px;}
.post-pay-btn.primary{background:linear-gradient(135deg, var(--acc), #ec4899); color:#fff; box-shadow:0 4px 14px var(--bakong-glow);}
.post-pay-btn.ghost{background:var(--bg2); color:var(--bakong-bright); border:1px solid rgba(139,92,246,.3);}

/* footer compact */
footer{padding:20px 14px calc(var(--tab-h) + 28px); text-align:center; color:var(--muted); font-size:11.5px; line-height:1.55;}
footer .fname{font-size:15px; color:#fff; margin-bottom:4px; font-weight:800;}
.trust-badge{display:inline-flex; align-items:center; gap:5px; margin:8px 0; padding:6px 12px;
  background:var(--paid-soft); color:var(--paid); border-radius:999px; font-size:11px; font-weight:700;
  border:1px solid rgba(34,197,94,.25);}
.trust-badge svg{width:13px; height:13px;}
.social-row{display:flex; justify-content:center; gap:8px; margin:10px 0;}
.social-link{width:36px; height:36px; border-radius:10px; background:var(--card); border:.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
.social-link svg{width:16px; height:16px;}
.accept-label{font-size:10px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin:12px 0 6px; color:var(--muted);}
.accept-row{display:flex; justify-content:center; gap:8px; flex-wrap:wrap;}
.accept-badge{display:inline-flex; align-items:center; gap:5px; padding:6px 12px; background:var(--card);

footer .links{margin:12px 0 6px; display:flex; justify-content:center; gap:14px;}

/* bottom tab bar — Sazz style */

}

.tabbar .ic svg{width:20px; height:20px;}


/* generic dark bottom sheet (orders / track) */
.sheet:not(.khqr-card){
  width:100%; max-width:420px; max-height:85vh; overflow-y:auto;
  background:var(--card); border:.5px solid var(--line);

  margin:0 0 4px; font-size:18px; font-weight:800; color:#fff; text-align:left;

}

  margin:0 0 14px; font-size:12.5px; color:var(--muted); font-weight:600;

}
.sheet:not(.khqr-card) .id-row{align-items:stretch; gap:8px;}
.sheet:not(.khqr-card) .id-row input{
  background:var(--bg); color:#fff; border:.5px solid var(--line-strong);
}
.sheet:not(.khqr-card) .btn-primary{
  flex:0 0 auto; width:auto; min-width:96px; padding:12px 16px; min-height:46px;
  font-size:13px; align-self:stretch;
}
.sheet:not(.khqr-card) .close-btn{
  width:100%; margin:12px 0 0; background:var(--bg2); color:var(--ink-soft);

}

}
.sheet:not(.khqr-card) .receipt-row .l{color:var(--muted);}
.sheet:not(.khqr-card) .receipt-row .v{color:#e2e8f0; font-weight:650;}
.sheet:not(.khqr-card) .receipt-total{color:#fff; border-top-color:var(--line-strong);}
.sheet:not(.khqr-card) .receipt-total .v{color:var(--bakong-bright);}
.sheet:not(.khqr-card) .empty-products{

/* 3-col packages on wider phones */

/* game detail header with art */

}

/* hero empty polish */
.hero-empty{

}

/* empty states */

/* —— commercial polish (like modern top-up sites) —— */
.trust-row{
  display:flex; gap:6px; padding:0 14px 10px; overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.trust-chip{

}
.trust-chip.ok{color:#4ade80; border-color:rgba(34,197,94,.25); background:rgba(34,197,94,.08);}

.games-wrap{

.games-wrap .game-grid{padding:0; margin:0;}
.section-in-wrap{padding:0 4px 10px; margin:0;}
.section-in-wrap h2{margin:0; font-size:11px; letter-spacing:.06em;}

.pop-ticker{

.pop-ticker .name{color:#e2e8f0; font-weight:750;}

.steps-row{

}
.step-pill{

}
.step-pill .n{

.detail-trust{display:flex; gap:6px; padding:0 14px 10px; flex-wrap:wrap;}
.detail-trust .trust-chip{font-size:10.5px; padding:5px 9px;}

.pkg-section-label{

}

/* FAB Telegram */

}

.fab-tg svg{width:26px; height:26px;}

  .fab-tg{bottom:28px;}
}
body.view-game .fab-tg{bottom:calc(var(--tab-h) + 78px + env(safe-area-inset-bottom));}
@media (min-width:720px){
  body.view-game .fab-tg{bottom:90px;}
}

/* product card polish */
.product-card .pmedia{
  width:52px; height:52px; margin:4px auto 8px;
  border-radius:14px; background:linear-gradient(145deg, var(--acc-soft), rgba(236,72,153,.12));
}
.product-card .pprice{letter-spacing:-.02em;}

/* search focus glow */
.home-search:focus-within{
  border-color:rgba(139,92,246,.45);
  box-shadow:0 0 0 3px var(--bakong-glow);
}

/* subtle page fade */
#main{animation:pageIn .28s ease both;}
@keyframes pageIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

/* safe area top */
.topbar{padding-top:max(10px, env(safe-area-inset-top));}


/* language switch — Sazz-style pill */
.lang-switcher{
  position:relative; display:inline-grid; grid-template-columns:1fr 1fr;
  align-items:center; width:88px; height:34px; padding:3px;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
  border-radius:999px; flex:none;
}
.lang-slider{
  position:absolute; top:3px; left:3px;
  width:calc(50% - 3px); height:calc(100% - 6px);
  background:linear-gradient(135deg, var(--acc), var(--acc-600));
  border-radius:999px; box-shadow:0 2px 8px rgba(124,58,237,.4);
  transition:transform .28s cubic-bezier(.34,1.5,.5,1); z-index:0;
}
.lang-switcher.km .lang-slider{transform:translateX(calc(100% + 3px));}
.lang-opt{
  position:relative; z-index:1; appearance:none; border:0; background:transparent;
  cursor:pointer; height:28px; border-radius:999px;
  display:inline-flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,.5); font-size:11px; font-weight:800; font-family:var(--fd);
  transition:color .2s;
}
.lang-opt.on{color:#fff;}
.lang-opt:not(.on):hover{color:rgba(255,255,255,.85);}
.auth-backdrop{
  position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.72);
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.auth-card{
  width:100%; max-width:360px; background:var(--card);
  border:.5px solid var(--line); border-radius:20px; padding:22px 18px 18px;
  box-shadow:var(--shadow-lg); position:relative;
}
.auth-card h3{margin:0 0 4px; font-size:20px; font-weight:800; color:#fff; text-align:center;}
.auth-card .auth-sub{text-align:center; color:var(--muted); font-size:12.5px; margin:0 0 16px; font-weight:600;}
.auth-tabs{display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--bg);
  border-radius:12px; padding:4px; margin-bottom:16px;}
.auth-tabs button{
  border:0; background:transparent; color:var(--muted); font-weight:700; font-size:13px;
  padding:10px; border-radius:9px; font-family:var(--fd); cursor:pointer;
}
.auth-tabs button.on{background:var(--acc); color:#fff; box-shadow:0 2px 10px var(--bakong-glow);}
.auth-field{margin-bottom:12px;}
.auth-field label{display:block; font-size:11px; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
.auth-field input{
  width:100%; background:var(--bg); border:.5px solid var(--line-strong); color:#fff;
  padding:13px 14px; border-radius:12px; font-size:15px; font-family:var(--fd); min-height:46px;
}
.auth-field input:focus{outline:none; border-color:var(--acc); box-shadow:0 0 0 3px var(--bakong-glow);}
.auth-field input::placeholder{color:rgba(139,147,167,.55);}
.auth-submit{
  width:100%; margin-top:6px; padding:14px; min-height:48px; border:0; border-radius:12px;
  background:linear-gradient(135deg, var(--acc), #ec4899); color:#fff;
  font-weight:750; font-size:15px; font-family:var(--fd); cursor:pointer;
  box-shadow:0 4px 16px var(--bakong-glow);
}
.auth-submit:active{transform:scale(.98);}
.auth-note{text-align:center; font-size:11.5px; color:var(--muted); margin-top:12px; line-height:1.45;}
.auth-close{
  position:absolute; top:12px; right:12px; width:36px; height:36px; border-radius:10px;
  background:var(--bg2); border:.5px solid var(--line); color:var(--muted);
  display:grid; place-items:center; cursor:pointer; font-size:16px;
}
.auth-guest{
  width:100%; margin-top:10px; padding:12px; border-radius:12px; border:.5px solid var(--line);
  background:var(--bg2); color:var(--ink-soft); font-weight:700; font-size:13px; font-family:var(--fd); cursor:pointer;
}
.topbar .avatar-btn{
  width:34px; height:34px; border-radius:10px; border:.5px solid var(--line);
  background:var(--acc-soft); color:var(--bakong-bright);
  display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;
}
.topbar .avatar-btn svg{width:16px; height:16px;}

.toast{position:fixed; bottom:calc(var(--tab-h) + 20px); left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--card-2); color:#fff; border:.5px solid var(--line);
  padding:11px 16px; border-radius:12px; font-size:13px; font-weight:650; opacity:0; transition:all .25s; z-index:200; max-width:90vw;
  box-shadow:var(--shadow-lg);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.err{background:rgba(239,68,68,.2); border-color:var(--stamp); color:#fca5a5;}
.skeleton{background:linear-gradient(90deg, var(--card), var(--card-2), var(--card)); background-size:200% 100%;
  animation:shimmer 1.2s infinite; border-radius:12px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.fade-in-section{opacity:0; transform:translateY(10px); transition:opacity .35s ease, transform .35s ease;}
.fade-in-section.visible{opacity:1; transform:none;}

.orders-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:90; display:flex; align-items:flex-end; justify-content:center;}
.orders-sheet{width:100%; max-width:420px; max-height:80vh; overflow-y:auto; background:var(--card);
  border:.5px solid var(--line); border-radius:20px 20px 0 0; padding:18px 14px calc(18px + env(safe-area-inset-bottom));}
.orders-sheet h3{margin:0 0 10px; font-size:17px; color:#fff; font-weight:800;}
.order-item{padding:11px; background:var(--bg2); border-radius:12px; margin-bottom:7px; font-size:12.5px; border:.5px solid var(--line);}
.order-item .row{display:flex; justify-content:space-between; margin-bottom:3px; color:#e2e8f0;}
.order-item .mono{font-size:11px; color:var(--muted);}

@media (min-width:720px){
  .game-grid{grid-template-columns:repeat(5,1fr); gap:16px 12px; max-width:920px; margin:0 auto;}
  .tabbar{display:none;}
  footer{padding-bottom:28px;}
  .buy-bar{bottom:0;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

// ---- constants shared with the backend (must match server_v11.py) ----
const PAYLOAD_KEY = "uGos5IJrYJWhOedsoAVx6OE+xJpVVArCXYhnQfa4NZU=";
const PAY_TIMEOUT_SECONDS = 300; // 5 min KHQR expiry window

// ---- state ----
let state = {
  view: "home",       // home | game
  games: [],
  banners: [],
  settings: null,
  activeGame: null,
  products: [],
  productsLoading: false,
  selectedProduct: null,
  playerId: "",
  zoneId: "",
  idCheck: null,       // null | "checking" | {ok:true,name} | {ok:false}
  heroIndex: 0,
  gameSearch: "",
  lang: (function(){ try { return localStorage.getItem("pvh_lang") || "km"; } catch(e){ return "km"; } })(),
  authTab: "login",
  user: (function(){ try { return JSON.parse(localStorage.getItem("pvh_user") || "null"); } catch(e){ return null; } })(),
};

// ---- i18n (EN / KM) + auth UI (appearance only) ----
const I18N = {
  km: {
    games: "ហ្គេម", track: "តាមដាន", orders: "Orders", help: "Help",
    searchPh: "ស្វែងរកហ្គេម ឬ #id...", popular: "POPULAR",
    trustFast: "⚡ Auto top-up", trustPay: "⬡ Bakong KHQR", trustOk: "✓ សុវត្ថិភាព",
    buyNow: "ទិញឥឡូវ", total: "សរុប", choosePkg: "ជ្រើសរើស Package",
    stepId: "ID", stepPkg: "Package", stepPay: "បង់",
    chipFast: "⚡ លឿន", chipPay: "⬡ KHQR", chipAuto: "✓ ស្វ័យប្រវត្តិ",
    myOrders: "ការបញ្ជាទិញ", ordersSub: "វាយ Player ID ដើម្បីមើលប្រវត្តិ និង track",
    search: "ស្វែងរក", close: "បិទ", login: "ចូល", signup: "ចុះឈ្មោះ",
    loginTitle: "សូមស្វាគមន៍", loginSub: "ចូលគណនី ឬបន្តជាភ្ញៀវ",
    email: "អ៊ីមែល / ទូរស័ព្ទ", password: "ពាក្យសម្ងាត់", name: "ឈ្មោះ",
    submitLogin: "ចូល", submitSignup: "បង្កើតគណនី", guest: "បន្តជាភ្ញៀវ",
    authNote: "រូបរាងស្អាត — មិនទាន់ភ្ជាប់ login ពិតប្រាកដ",
    loggedAs: "បានចូល", logout: "ចាកចេញ", rec: "ពេញនិយម", allPkg: "ទាំងអស់",
  },
  en: {
    games: "Games", track: "Track", orders: "Orders", help: "Help",
    searchPh: "Search games or #id...", popular: "POPULAR",
    trustFast: "⚡ Auto top-up", trustPay: "⬡ Bakong KHQR", trustOk: "✓ Secure",
    buyNow: "Buy now", total: "Total", choosePkg: "Choose package",
    stepId: "ID", stepPkg: "Package", stepPay: "Pay",
    chipFast: "⚡ Fast", chipPay: "⬡ KHQR", chipAuto: "✓ Auto",
    myOrders: "My orders", ordersSub: "Enter Player ID to view history & track",
    search: "Search", close: "Close", login: "Log in", signup: "Sign up",
    loginTitle: "Welcome", loginSub: "Sign in or continue as guest",
    email: "Email / Phone", password: "Password", name: "Name",
    submitLogin: "Log in", submitSignup: "Create account", guest: "Continue as guest",
    authNote: "UI only — real auth not connected yet",
    loggedAs: "Signed in", logout: "Log out", rec: "Popular", allPkg: "All",
  }
};
function t(key){
  const lang = state.lang || "km";
  return (I18N[lang] && I18N[lang][key]) || (I18N.km && I18N.km[key]) || key;
}
function setLang(lang){
  state.lang = lang === "en" ? "en" : "km";
  try { localStorage.setItem("pvh_lang", state.lang); } catch(e){}
  render();
}
function openAuth(tab){
  state.authTab = tab === "signup" ? "signup" : "login";
  showAuthModal();
}
function showAuthModal(){
  const existing = document.getElementById("authModal");
  if(existing) existing.remove();
  const isSignup = state.authTab === "signup";
  const root = document.createElement("div");
  root.className = "auth-backdrop";
  root.id = "authModal";
  root.innerHTML = `
    <div class="auth-card">
      <button type="button" class="auth-close" id="authCloseBtn">✕</button>
      <h3>${t("loginTitle")}</h3>
      <p class="auth-sub">${t("loginSub")}</p>
      <div class="auth-tabs">
        <button type="button" class="${!isSignup ? "on" : ""}" data-tab="login">${t("login")}</button>
        <button type="button" class="${isSignup ? "on" : ""}" data-tab="signup">${t("signup")}</button>
      </div>
      ${isSignup ? `<div class="auth-field"><label>${t("name")}</label><input type="text" id="authName" placeholder="Name" autocomplete="name"></div>` : ""}
      <div class="auth-field"><label>${t("email")}</label><input type="text" id="authEmail" placeholder="email@example.com" autocomplete="username"></div>
      <div class="auth-field"><label>${t("password")}</label><input type="password" id="authPass" placeholder="••••••••" autocomplete="${isSignup ? "new-password" : "current-password"}"></div>
      <button type="button" class="auth-submit" id="authSubmit">${isSignup ? t("submitSignup") : t("submitLogin")}</button>
      <button type="button" class="auth-guest" id="authGuest">${t("guest")}</button>
      <p class="auth-note">${t("authNote")}</p>
    </div>`;
  document.body.appendChild(root);
  root.querySelectorAll(".auth-tabs button").forEach(btn => {
    btn.onclick = () => { state.authTab = btn.dataset.tab; showAuthModal(); };
  });
  document.getElementById("authCloseBtn").onclick = () => root.remove();
  root.onclick = (e) => { if(e.target === root) root.remove(); };
  document.getElementById("authGuest").onclick = () => { root.remove(); toast(t("guest")); };
  document.getElementById("authSubmit").onclick = () => {
    const email = (document.getElementById("authEmail") && document.getElementById("authEmail").value.trim()) || "";
    if(!email){ toast(t("email"), true); return; }
    const nm = (document.getElementById("authName") && document.getElementById("authName").value.trim()) || email.split("@")[0] || "User";
    state.user = { name: nm, email };
    try { localStorage.setItem("pvh_user", JSON.stringify(state.user)); } catch(e){}
    root.remove();
    toast(t("loggedAs") + ": " + state.user.name);
    render();
  };
}
function logout(){
  state.user = null;
  try { localStorage.removeItem("pvh_user"); } catch(e){}
  toast(t("logout"));
  render();
}

// ---- helpers ----
function $(sel, root){ return (root||document).querySelector(sel); }
function vibrate(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms || 10); }catch(e){} } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=> t.classList.remove("show"), 3200);
}
async function api(path, opts){
  opts = opts || {};
  if(typeof navigator !== "undefined" && navigator.onLine === false){
    return { success: false, error: "គ្មាន internet — សូមពិនិត្យការតភ្ជាប់របស់អ្នក" };
  }
  try {
    const res = await fetch("/api/" + path, {
      method: opts.method || "GET",
      headers: Object.assign({"Content-Type":"application/json"}, opts.headers||{}),
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    let data;
    try { data = await res.json(); } catch(e){ data = {}; }
    if(!res.ok && !data.error){
      data.success = false;
      data.error = data.error || ("បញ្ហាម៉ាស៊ីនមេ (" + res.status + ")");
    }
    return data;
  } catch(e){
    return { success: false, error: "ភ្ជាប់ម៉ាស៊ីនមេមិនបាន — សូមព្យាយាមម្តងទៀត" };
  }
}
function decryptPayload(payloadB64){
  const bytes = CryptoJS.AES.decrypt(payloadB64, PAYLOAD_KEY);
  const text = bytes.toString(CryptoJS.enc.Utf8);
  return JSON.parse(text);
}

// ---- recent Player IDs (localStorage, per game — pure convenience, no server round-trip) ----
const RECENT_IDS_KEY = "pvh_recent_ids_v1";
function loadRecentIds(){
  try{ return JSON.parse(localStorage.getItem(RECENT_IDS_KEY) || "{}"); }catch(e){ return {}; }
}
function saveRecentId(gameCode, playerId, zoneId, name){
  if(!playerId) return;
  const all = loadRecentIds();
  const list = (all[gameCode] || []).filter(e => e.playerId !== playerId);
  list.unshift({ playerId, zoneId: zoneId || "", name: name || "", ts: Date.now() });
  all[gameCode] = list.slice(0, 3);
  try{ localStorage.setItem(RECENT_IDS_KEY, JSON.stringify(all)); }catch(e){}
}
function getRecentIds(gameCode){
  return (loadRecentIds()[gameCode] || []);
}
function lastUsedPlayerIdAnyGame(){
  const all = loadRecentIds();
  let best = null;
  Object.values(all).forEach(list => (list||[]).forEach(e => { if(!best || e.ts > best.ts) best = e; }));
  return best;
}

// ---- ID validation (debounced) ----
let idCheckTimer = null;

function onFieldFocus(el){
  // iOS/Android keyboard can cover the sticky buy bar — scroll field into mid-view
  setTimeout(() => {
    try { el.scrollIntoView({ behavior: "smooth", block: "center" }); } catch(e){}
  }, 300);
}

function onIdInput(field, value){
  state[field] = value;
  state.idCheck = null;
  renderIdStatus();
  clearTimeout(idCheckTimer);
  const needsZone = !!state.activeGame.has_server_id;
  if(!state.playerId || (needsZone && !state.zoneId)) return;
  idCheckTimer = setTimeout(checkId, 550);
}
function isTelegramGame(g){
  return !!g && (g.fulfillment_type === "telegram_stars" || g.fulfillment_type === "telegram_premium");
}
async function checkId(){
  if(isTelegramGame(state.activeGame)){
    // Khmer TopUp has no player-name check for Telegram usernames —
    // skip the wasted round-trip and never block checkout on it.
    state.idCheck = null;
    renderIdStatus();
    return;
  }
  state.idCheck = "checking";
  renderIdStatus();
  const r = await api("check-user", {method:"POST", body:{
    gameCode: state.activeGame.code, userId: state.playerId, zoneId: state.zoneId || undefined,
  }});
  if(r.success && r.name){
    state.idCheck = {ok:true, name:r.name};
    saveRecentId(state.activeGame.code, state.playerId, state.zoneId, r.name);
  } else if(r.success && r.name === null){
    state.idCheck = null; // auto-check unavailable server-side, don't block checkout
  } else {
    state.idCheck = {ok:false};
  }
  renderIdStatus();
}
function renderIdStatus(){
  const el = $("#idStatus");
  if(!el) return;
  if(state.idCheck === "checking"){ el.textContent = "កំពុងឆែក ID..."; el.className = "id-status checking"; }
  else if(state.idCheck && state.idCheck.ok){ el.innerHTML = ICONS.check + " " + ICONS.user + " " + esc(state.idCheck.name); el.className = "id-status ok"; }
  else if(state.idCheck && !state.idCheck.ok){
    const label = isTelegramGame(state.activeGame) ? "រកមិនឃើញគណនី Telegram" : "រកមិនឃើញ Player ID";
    el.innerHTML = ICONS.cross + " " + label; el.className = "id-status err";
  }
  else { el.textContent = ""; el.className = "id-status"; }
  updateBuyBarState();

  const needsZone = !!(state.activeGame && state.activeGame.has_server_id);
  const hasId = !!(state.playerId && (!needsZone || state.zoneId));
  document.querySelectorAll(".steps-row .step-pill").forEach((el, i) => {
    if(i === 0) el.classList.toggle("on", hasId);
  });
}

function selectProduct(id){
  vibrate(8);
  state.selectedProduct = state.products.find(p => p.id === id) || null;
  // Lightweight update — don't re-render whole page (keeps keyboard/scroll/ID focus)
  document.querySelectorAll(".product-card").forEach(card => {
    const pid = Number(card.getAttribute("data-pid"));
    const on = state.selectedProduct && pid === state.selectedProduct.id;
    card.classList.toggle("selected", !!on);
  });
  const priceEl = document.querySelector(".buy-bar .total .v");
  if(priceEl){
    priceEl.textContent = "$" + (state.selectedProduct ? Number(state.selectedProduct.price).toFixed(2) : "0.00");
  }
  updateBuyBarState();
  const bar = document.querySelector(".buy-bar");
  if(bar) bar.scrollIntoView({ behavior: "smooth", block: "nearest" });

  // refresh step pills without full re-render
  document.querySelectorAll(".steps-row .step-pill").forEach((el, i) => {
    if(i === 1) el.classList.toggle("on", !!state.selectedProduct);
  });
}
function updateBuyBarState(){
  const btn = $("#buyBtn");
  const hint = $("#buyHint");
  if(!btn) return;
  const g = state.activeGame;
  let ready = false;
  let why = "";
  if(g && g.fulfillment_type === "giftcard"){
    ready = !!state.selectedProduct;
    if(!ready) why = "ជ្រើសរើស package សិន";
  } else {
    const needsZone = !!(g && g.has_server_id);
    if(!state.selectedProduct) why = "ជ្រើសរើស package សិន";
    else if(!state.playerId) why = isTelegramGame(g) ? "បញ្ចូល Telegram Username" : "បញ្ចូល Player ID";
    else if(needsZone && !state.zoneId) why = "បញ្ចូល Zone ID";
    else if(state.idCheck && state.idCheck.ok === false) why = "Player ID មិនត្រឹមត្រូវ";
    ready = state.selectedProduct && state.playerId && (!needsZone || state.zoneId) && !(state.idCheck && state.idCheck.ok === false);
  }
  btn.disabled = !ready;
  if(hint) hint.textContent = ready ? "" : why;
}

// ---- checkout / payment ----
let pollPayTimer = null, pollTopupTimer = null, countdownTimer = null;

async function buyNow(){
  if(!state.selectedProduct) return;
  vibrate(14);
  const amount = Number(state.selectedProduct.price);
  const userId = state.playerId;

  const btn = $("#buyBtn");
  if(btn){ btn.disabled = true; btn.textContent = state.lang==="en" ? "Creating QR..." : "កំពុងបង្កើត QR..."; }

  const r = await api("create-payment", {
    method:"POST",
    body:{userId, zoneId: state.zoneId || "", gameCode: state.activeGame.code, productId: state.selectedProduct.id},
  });

  if(!r.success){
    toast(r.error || "បង្កើត QR មិនជោគជ័យ", true);
    if(btn){ btn.disabled = false; btn.textContent = t("buyNow"); }
    return;
  }
  openPaymentSheet(r.trx_id, r.qr_image, r.pay_url, amount);
}

function openPaymentSheet(trxId, qrImage, payUrl, amount){
  let secondsLeft = PAY_TIMEOUT_SECONDS;
  const merchant = (state.settings && (state.settings.SITE_NAME || state.settings.FOOTER_NAME)) || "PVH TOPUP";
  const root = document.createElement("div");
  root.className = "sheet-backdrop";
  root.id = "paySheet";
  root.innerHTML = `
    <div class="sheet khqr-card">
      <div class="khqr-head">
        <div class="khqr-logo">KHQR</div>
      </div>
      <div class="khqr-body">
        <div class="khqr-meta">
          <span class="tag">Bakong KHQR</span>
          <span class="timer"><span class="dot"></span><span id="payTimer">05:00</span></span>
        </div>
        <div class="khqr-merchant">${esc(merchant)}</div>
        <div class="khqr-amount">${amount.toFixed(2)} <small>USD</small></div>
        <hr class="khqr-divider">
        <div class="qr-frame" id="qrFrame">
          ${qrImage ? `<img src="${qrImage}" alt="KHQR">` : ""}
          <div class="qr-dollar">$</div>
        </div>
        <div class="khqr-scan">Scan to pay</div>
        <div class="khqr-or">or</div>
        <button type="button" class="khqr-dl" id="dlQrBtn">⬇ Download QR</button>
        <p class="khqr-hint">and upload to a Mobile Banking app supporting KHQR</p>
      </div>
      <div class="pay-status waiting" id="payStatus">កំពុងរង់ចាំការទូទាត់...</div>
      <button class="close-btn" id="closeSheetBtn">បិទ</button>
    </div>`;
  document.body.appendChild(root);

  $("#closeSheetBtn").onclick = () => closePaymentSheet(trxId, true);

  const dlBtn = $("#dlQrBtn");
  if(dlBtn && qrImage){
    dlBtn.onclick = () => {
      try{
        const a = document.createElement("a");
        a.href = qrImage;
        a.download = "khqr-" + trxId + ".png";
        document.body.appendChild(a);
        a.click();
        a.remove();
        toast("បានទាញ QR");
      }catch(e){ toast("មិនអាចទាញ QR បានទេ", true); }
    };
  }

  countdownTimer = setInterval(() => {
    secondsLeft--;
    const mm = String(Math.floor(secondsLeft/60)).padStart(2,"0");
    const ss = String(secondsLeft%60).padStart(2,"0");
    const timerEl = $("#payTimer");
    if(timerEl) timerEl.textContent = mm + ":" + ss;
    if(secondsLeft <= 0){
      clearInterval(countdownTimer);
      api("expire-payment", {method:"POST", body:{trx_id: trxId}});
      setPayStatus("failed", "QR ផុតកំណត់ — សូមចាប់ផ្តើមម្តងទៀត");
      clearInterval(pollPayTimer);
    }
  }, 1000);

  pollPayTimer = setInterval(async () => {
    const r = await api("check-payment", {method:"POST", body:{trx_id: trxId}});
    if(r.paid){
      clearInterval(pollPayTimer);
      clearInterval(countdownTimer);
      const ds = (r.data && r.data.delivery_status) || null;
      handleDeliveryStatus(trxId, ds, r.data || null);
    } else if(r.expired){
      clearInterval(pollPayTimer);
      clearInterval(countdownTimer);

function fmtDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "—";
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function deliveryStatusLabel(ds){
  if(ds === "delivered") return "✓ បានបញ្ជូនស្វ័យប្រវត្តិ";
  if(ds === "processing") return "កំពុងបញ្ជូន";
  if(ds === "failed") return "បញ្ជូនមិនកើត — ត្រូវការ manual";
  return "រង់ចាំ admin បញ្ជូន";
}
function receiptText(order, trxId){
  const g = state.activeGame, p = state.selectedProduct;
  const isGiftcard = g && g.fulfillment_type === "giftcard";
  const idLine = isTelegramGame(g) ? "Telegram Username" : "Player ID";
  const lines = [
    `វិក័យប័ត្រ PVH TOPUP`,
    `Trx ID: ${trxId}`,
    `ថ្ងៃ: ${fmtDateTime(order.paid_at || order.created_at)}`,
    `ហ្គេម: ${g ? g.name : order.game_code}`,
    `Package: ${p ? p.name : ""}`,
  ];
  if(!isGiftcard) lines.push(`${idLine}: ${order.user_id}${order.zone_id ? " ("+order.zone_id+")" : ""}`);
  lines.push(`តម្លៃ: $${Number(order.amount).toFixed(2)}`);
  lines.push(`ស្ថានភាព: ${deliveryStatusLabel(order.delivery_status)}`);
  if(order.delivery_code) lines.push(`Gift Card Code: ${order.delivery_code}`);
  return lines.join("\n");
}

      setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = `${ICONS.chat} ចម្លងវិក័យប័ត្រ`; }, 2000);

    actions.innerHTML = `

function handleDeliveryStatus(trxId, ds, order){
  if(ds === "delivered"){
    setPayStatus("success", ICONS.check + " ទូទាត់ជោគជ័យ — ទទួល Diamond ដោយស្វ័យប្រវត្តិ!");
  } else if(ds === "processing"){
    setPayStatus("processing", ICONS.clock + " កំពុងបញ្ជូន Diamond ស្វ័យប្រវត្តិ...");
    pollTopupTimer = setInterval(async () => {
      const r = await api("check-topup-status", {method:"POST", body:{trx_id: trxId}});
      if(r.delivery_status === "delivered"){
        clearInterval(pollTopupTimer);
        setPayStatus("success", ICONS.check + " ទូទាត់ជោគជ័យ — ទទួល Diamond ដោយស្វ័យប្រវត្តិ!");
        if(order){ order.delivery_status = "delivered"; renderReceipt(order, trxId); }
      } else if(r.delivery_status === "failed"){
        clearInterval(pollTopupTimer);
        setPayStatus("failed", "ទូទាត់ជោគជ័យ ប៉ុន្តែបញ្ជូនស្វ័យប្រវត្តិមិនកើត — ទាក់ទង admin ខាងក្រោម");
        if(order){ order.delivery_status = "failed"; renderReceipt(order, trxId); }
      }
    }, 4000);
  } else if(ds === "failed"){
    setPayStatus("failed", "ទូទាត់ជោគជ័យ ប៉ុន្តែបញ្ជូនស្វ័យប្រវត្តិមិនកើត — ទាក់ទង admin ខាងក្រោម");
  } else {
    setPayStatus("success", ICONS.check + " ទូទាត់ជោគជ័យ — admin នឹងបញ្ជូនជូនក្នុងពេលឆាប់ៗ");
  }
  if(order) renderReceipt(order, trxId);
}

// ---- micro-interactions: reveal sections as they scroll into view ----
let revealObserver = null;
function initScrollReveal(){
  if(!("IntersectionObserver" in window)) return;
  if(!revealObserver){
    revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add("visible");
          revealObserver.unobserve(entry.target);
        }
      });
    }, {threshold:0.12, rootMargin:"0px 0px -40px 0px"});
  }
  const targets = document.querySelectorAll(
    "#main .section, #main .game-grid, #main .product-grid, #main .id-form, #main .hero, #main .promo-strip, #main .detail-header"
  );
  targets.forEach(el => {
    if(!el.classList.contains("fade-in-section")){
      el.classList.add("fade-in-section");
      revealObserver.observe(el);
    }
  });
}

        <div class="v" id="buyTotal">$0.00</div>
      </div>
      <div class="buy-actions">
        <button class="btn-primary" id="buyBtn" disabled onclick="__app.buyNow()">${t("buyNow")}</button>
        <div class="buy-hint" id="buyHint"></div>
      </div>
    </div>
  `;
}

function render(){
  const app = $("#app");
  const tabHome = state.view === "home" ? "on" : "";
  document.body.classList.toggle("view-game", state.view === "game");
  const tg = (state.settings && state.settings.ADMIN_TELEGRAM_LINK) || "";
  app.innerHTML = `
    <div class="topbar" id="topbar"></div>
    <div id="main">${state.view === "home" ? renderHome() : renderGame()}</div>
    <footer id="footer"></footer>
    <nav class="tabbar" id="tabbar">
      <button type="button" class="${tabHome}" onclick="__app.goHome()">${ICONS.games}<span>${t("games")}</span></button>
      <button type="button" onclick="__app.openMyOrders()">${ICONS.track}<span>${t("track")}</span></button>
      <button type="button" onclick="__app.openMyOrders()">${ICONS.history}<span>${t("orders")}</span></button>
      <button type="button" onclick="__app.openAuth('login')">${ICONS.userTab}<span>${state.user ? esc(state.user.name.slice(0,8)) : t("login")}</span></button>
    </nav>
    ${tg ? `<a class="fab-tg" href="${esc(tg)}" target="_blank" rel="noopener" aria-label="Telegram">${ICONS.telegram}</a>` : ""}
  `;
  renderTopbarAndFooter();
  if(state.view === "game"){ renderIdStatus(); updateBuyBarState(); }
  initScrollReveal();
}

// expose the handful of functions used by inline onclick/oninput in rendered HTML
window.__app = { openGame: (id)=>{ const g = state.games.find(x=>x.id===id); if(g) openGame(g); },
  goHome, selectProduct, onIdInput, onFieldFocus, onGameSearch, buyNow, useRecentId, openMyOrders, closeMyOrders, searchMyOrders, setLang, openAuth, logout };

// ---- boot ----
render();
loadSiteSettings();
loadHome();

})();
</script>
</body>
</html>
