<!--
DESIGN PLAN — PVH TOPUP storefront (v3: Receipt & Ticket, per user request)
Subject: Cambodian mobile-game diamond top-up shop, paid via KHQR (Bakong).
Audience: young Khmer mobile gamers on phones, low patience, want 3 taps to pay.
Page's job: pick game -> pick diamond package -> confirm player ID -> pay via KHQR -> see delivery.

Concept: the whole UI reads as a strip of paper receipts and torn arcade tickets —
the literal artifact this business hands out every day (a KHQR payment slip) and
the literal artifact its product resembles (a game top-up token/ticket). No glass,
no neon — flat paper, ink, a rubber stamp, a perforated tear.

Color (named):
  --paper / --paper-2: #F6F1E4 / #EFE8D6   (cream receipt paper, two shades for stripes)
  --card:  #FFFDF6                          (whiter card stock, sits above the paper)
  --ink:   #1C1B19                          (near-black ink — text)
  --ink-soft: #6B6558                       (faded ink — secondary text)
  --stamp: #C0392B                          (red ink-stamp — urgent/danger/badges)
  --bakong:#1E5AA8                          (KHQR/Bakong blue — the one real brand tie, CTA only)
  --paid:  #3F7A4A                          (stamp green — success)
  --line:  #D3CBB4                          (perforation / dashed dividers)

Type: Bebas Neue (display — tall condensed caps, ticket-stub / stamp lettering)
      Archivo (body — grotesk, plain and legible)
      Space Mono (prices, IDs, trx refs — typewriter/receipt-printer feel)
      Kantumruy Pro (Khmer, paired throughout)

Signature element: a torn/perforated edge (zigzag clip-path) on the hero banner and
on the payment sheet's top edge, as if tearing a slip off a receipt roll; game and
product cards get a die-cut "ticket stub" notch (two punched half-circles) at the
seam between image and label, and successful payments get a rotated ink-stamp badge.
-->
<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PVH TOPUP</title>
<meta name="description" content="Game top-up Free Fire, Mobile Legends — ទូទាត់ KHQR លឿន សុវត្ថិភាព ដឹកជញ្ជូនស្វ័យប្រវត្តិ">
<meta property="og:title" content="PVH TOPUP">
<meta property="og:description" content="Game top-up Free Fire, Mobile Legends — ទូទាត់ KHQR លឿន សុវត្ថិភាព">
<meta property="og:image" content="/icon-512.png">
<meta property="og:type" content="website">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#1E5AA8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
:root{
  --paper:#F6F1E4; --paper-2:#EFE8D6; --card:#FFFDF6;
  --ink:#1C1B19; --ink-soft:#6B6558;
  --stamp:#C0392B; --bakong:#1E5AA8; --paid:#3F7A4A;
  --line:#D3CBB4; --line-strong:#B9AF90;
  --text:var(--ink); --muted:var(--ink-soft); --gold:var(--stamp); --gem:var(--bakong); --success:var(--paid); --danger:#B23A2E;
  --notch:9px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
.icon{display:inline-block; vertical-align:-3px; line-height:0;}
.icon svg{width:1em; height:1em; display:block;}
html,body{margin:0; padding:0; min-height:100%;
  background:
    repeating-linear-gradient(180deg, transparent 0 63px, rgba(28,27,25,.035) 63px 64px),
    var(--paper);
  color:var(--text); font-family:'Archivo','Kantumruy Pro',sans-serif; overflow-x:hidden;}
h1,h2,h3,.display,.topbar .sitename,footer .fname,.detail-header .gname,.game-card .info .gname,.product-card .pname,.btn-primary,.sheet h3{
  font-family:'Bebas Neue','Kantumruy Pro',sans-serif; letter-spacing:.6px; font-weight:400;}
.mono{font-family:'Space Mono','Kantumruy Pro',monospace;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
::-webkit-scrollbar{display:none;}

/* signature: a die-cut ticket-stub corner (one small triangle bitten out) */
.facet{
  clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
  position:relative;
}
.facet::after{
  content:""; position:absolute; top:0; left:0; width:14px; height:14px;
  background:
    radial-gradient(circle at 0 0, transparent 14px, var(--paper) 14.5px);
  pointer-events:none;
}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:10px;
  padding:13px 16px; background:var(--paper);
  border-bottom:2px dashed var(--line-strong);
}
.topbar img.logo{height:32px; width:32px; border-radius:6px; object-fit:cover; border:1.5px solid var(--ink);}
.topbar .sitename{font-size:22px; letter-spacing:1.2px;}
.topbar .spacer{flex:1;}
.topbar .contact-btn{
  display:flex; align-items:center; gap:6px; padding:8px 12px;
  background:var(--card); color:var(--ink); font-size:12.5px; font-weight:700;
  border:1.5px solid var(--ink); border-radius:3px;
  box-shadow:2px 2px 0 var(--ink);
}

/* ---------- hero banner: torn receipt edge ---------- */
.hero{position:relative; width:100%; aspect-ratio:16/8.4; overflow:hidden; background:var(--card);
  clip-path: polygon(
    0 0, 100% 0, 100% 92%,
    93% 100%, 86% 92%, 79% 100%, 72% 92%, 65% 100%, 58% 92%, 51% 100%, 44% 92%, 37% 100%,
    30% 92%, 23% 100%, 16% 92%, 9% 100%, 2% 92%, 0 96%
  );
}
.hero-track{display:flex; height:100%; transition:transform .5s ease;}
.hero-slide{flex:0 0 100%; height:100%;}
.hero-slide img{width:100%; height:100%; object-fit:cover; display:block;}
.hero-dots{position:absolute; bottom:16px; left:0; right:0; display:flex; justify-content:center; gap:6px;}
.hero-dots span{width:5px; height:5px; border-radius:50%; background:rgba(28,27,25,.28);}
.hero-dots span.active{background:var(--stamp); width:15px; border-radius:3px;}
.hero-empty{display:flex; align-items:center; justify-content:center; gap:6px; height:100%; color:var(--muted); font-size:13px; background:
  repeating-linear-gradient(135deg, var(--paper-2) 0 10px, var(--paper) 10px 20px);}

/* ---------- small promo ---------- */
.promo-strip{display:flex; gap:10px; padding:14px 16px 4px; overflow-x:auto;}
.promo-strip img{height:62px; border-radius:2px; flex:0 0 auto; border:1.5px solid var(--ink); box-shadow:2px 2px 0 var(--line-strong);}

/* ---------- section ---------- */
.section{padding:20px 16px 10px;}
.section h2{font-size:19px; color:var(--ink); font-weight:400; letter-spacing:1px; margin:0 0 12px;
  display:flex; align-items:center; gap:10px;}
.section h2::after{content:""; flex:1; height:0; border-top:2px dashed var(--line-strong); transform:translateY(-2px);}

/* ---------- game grid: ticket cards ---------- */
.game-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:0 16px 22px;}
.game-card, .product-card, .id-form, .sheet{
  background:var(--card); border:1.5px solid var(--ink);
  box-shadow:3px 3px 0 var(--line-strong);
}
.game-card{
  position:relative; overflow:visible;
  display:flex; flex-direction:column;
}
.game-card .media{position:relative; aspect-ratio:1/.8; overflow:hidden; background:var(--paper-2);}
.game-card .media img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease;}
.game-card:active .media img{transform:scale(1.08);}
.game-card .gem-badge{position:absolute; top:-8px; right:8px; z-index:2; width:26px; height:26px; border-radius:50%;
  background:var(--stamp); display:flex; align-items:center; justify-content:center;
  color:#fff; border:2px solid var(--ink); transform:rotate(-8deg);}
.game-card .gem-badge svg{width:12px; height:12px;}
/* die-cut notches at the ticket-stub seam */
.game-card .info{position:relative; z-index:2; padding:12px 10px 10px; background:var(--card);
  border-top:2px dashed var(--line-strong); display:flex; flex-direction:column; gap:3px;}
.game-card .info::before, .game-card .info::after{
  content:""; position:absolute; top:-9px; width:16px; height:16px; border-radius:50%;
  background:var(--paper); border:1.5px solid var(--ink); z-index:3;
}
.game-card .info::before{left:-9px;}
.game-card .info::after{right:-9px;}
.game-card .info .gname{font-size:17px; letter-spacing:.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.game-card .info .cta{display:flex; align-items:center; gap:3px; font-size:11px; font-weight:700; color:var(--bakong); text-transform:uppercase; letter-spacing:.4px;}
.game-card .info .cta svg{width:10px; height:10px;}

/* ---------- product grid (game detail) ---------- */
.detail-header{display:flex; align-items:center; gap:12px; padding:16px 16px 12px;}
.back-btn{width:36px; height:36px; border-radius:4px; background:var(--card); border:1.5px solid var(--ink);
  display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:2px 2px 0 var(--line-strong);}
.detail-header .gname{font-size:22px; letter-spacing:.8px;}

.id-form{margin:0 16px 16px; padding:16px 14px; position:relative;}
.id-form label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; display:block; margin-bottom:7px; font-weight:700;}
.id-row{display:flex; gap:8px; margin-bottom:10px;}
.id-field{position:relative; flex:1;}
.id-field.zone-field{flex:0 0 100px;}
.id-field .field-icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; z-index:1;}
.id-field .field-icon svg{width:16px; height:16px;}
.id-row input{width:100%; background:var(--paper); border:1.5px solid var(--ink); color:var(--ink);
  padding:11px 12px 11px 34px; border-radius:3px; font-size:14px; font-family:'Space Mono','Kantumruy Pro',monospace;}
.id-row input:focus{outline:2px solid var(--bakong); outline-offset:1px;}
.id-status{font-size:13px; min-height:18px; padding-top:2px; display:flex; align-items:center; gap:5px; font-weight:600;}
.id-status.ok{color:var(--paid);}
.id-status.err{color:var(--stamp);}
.id-status.checking{color:var(--muted);}
.empty-products{grid-column:1/-1; text-align:center; padding:34px 16px; color:var(--muted); font-size:13.5px; display:flex; flex-direction:column; align-items:center; gap:8px;
  border:1.5px dashed var(--line-strong); border-radius:4px; background:var(--card);}
.recent-ids{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.id-chip{display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:20px; background:var(--paper);
  border:1.5px solid var(--ink); color:var(--ink); font-size:12px; font-weight:700;}
.id-chip svg{width:12px; height:12px;}

.product-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 18px;}
.product-card{
  padding:12px 12px 14px; text-align:center; position:relative;
}
.product-card.selected{border-color:var(--bakong); box-shadow:3px 3px 0 var(--bakong);}
.product-card .badge{position:absolute; top:-8px; left:10px; font-size:10px; background:var(--stamp); color:#fff;
  padding:3px 7px; border-radius:20px; font-weight:700; display:flex; align-items:center; gap:3px; border:1.5px solid var(--ink);}
.product-card .pmedia{width:52px; height:52px; margin:0 auto 8px; border-radius:50%; overflow:hidden;
  background:var(--paper-2); border:1.5px dashed var(--line-strong);
  display:flex; align-items:center; justify-content:center;}
.product-card .pmedia img{width:100%; height:100%; object-fit:cover; display:block;}
.product-card .pmedia .fallback{color:var(--stamp); opacity:.85;}
.product-card .pmedia .fallback svg{width:20px; height:20px;}
.product-card .pname{font-size:13px; font-weight:600; margin-bottom:7px; line-height:1.25;
  min-height:2.5em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.product-card .pprice{font-family:'Space Mono','Kantumruy Pro',monospace; color:var(--stamp); font-weight:700; font-size:15px;}

.buy-bar{position:sticky; bottom:0; z-index:40; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:var(--card); border-top:2px dashed var(--line-strong);
  box-shadow:0 -3px 0 var(--paper), 0 -4px 0 var(--line);
  display:flex; align-items:center; gap:12px;}
.buy-bar .total{flex:1;}
.buy-bar .total .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; font-weight:700;}
.buy-bar .total .v{font-family:'Space Mono','Kantumruy Pro',monospace; font-size:19px; font-weight:700; color:var(--stamp);}
.btn-primary{
  background:var(--bakong); color:#fff; font-size:17px; letter-spacing:1px; padding:14px 26px;
  border-radius:3px; border:1.5px solid var(--ink); box-shadow:3px 3px 0 var(--ink);
}
.btn-primary:disabled{background:var(--paper-2); color:var(--muted); box-shadow:3px 3px 0 var(--line);}

/* ---------- payment sheet: torn receipt slip ---------- */
.sheet-backdrop{position:fixed; inset:0; background:rgba(28,27,25,.55); z-index:90; display:flex; align-items:flex-end;}
.sheet{width:100%; background:var(--card); padding:26px 20px calc(20px + env(safe-area-inset-bottom));
  clip-path: polygon(
    0 14px, 3% 5px, 6% 14px, 9% 5px, 12% 14px, 15% 5px, 18% 14px, 21% 5px, 24% 14px, 27% 5px,
    30% 14px, 33% 5px, 36% 14px, 39% 5px, 42% 14px, 45% 5px, 48% 14px, 51% 5px, 54% 14px, 57% 5px,
    60% 14px, 63% 5px, 66% 14px, 69% 5px, 72% 14px, 75% 5px, 78% 14px, 81% 5px, 84% 14px, 87% 5px,
    90% 14px, 93% 5px, 96% 14px, 99% 5px, 100% 14px,
    100% 100%, 0 100%
  );
  max-height:88vh; overflow-y:auto; border:none;
}
.sheet h3{margin:10px 0 4px; font-size:24px; letter-spacing:.6px;}
.sheet .sub{color:var(--muted); font-size:12px; margin-bottom:16px; text-transform:uppercase; letter-spacing:1px; font-weight:700;}
.qr-frame{background:#fff; padding:16px; margin:0 auto 14px; width:min(230px,68vw);
  border:1.5px solid var(--ink); box-shadow:3px 3px 0 var(--line-strong);}
.qr-frame canvas, .qr-frame img{width:100%; height:auto; display:block;}
.pay-url-btn{display:block; text-align:center; margin:0 auto 14px; color:var(--bakong); font-size:13px; font-weight:700; text-decoration:underline;}
.pay-amount{text-align:center; font-family:'Space Mono','Kantumruy Pro',monospace; font-size:26px; color:var(--stamp); font-weight:700; margin-bottom:4px;}
.pay-timer{text-align:center; color:var(--muted); font-size:13px; margin-bottom:16px; font-family:'Space Mono',monospace;}
.pay-status{text-align:center; padding:13px; border-radius:3px; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;
  border:1.5px dashed var(--line-strong);}
.pay-status.waiting{background:var(--paper); color:var(--muted);}
.pay-status.success{background:#fff; color:var(--paid); border:3px solid var(--paid); transform:rotate(-1.2deg);
  text-transform:uppercase; letter-spacing:1px;}
.pay-status.processing{background:rgba(30,90,168,.08); color:var(--bakong); border-style:solid; border-color:var(--bakong);}
.pay-status.failed{background:#fff; color:var(--stamp); border:3px solid var(--stamp); transform:rotate(-1.2deg);
  text-transform:uppercase; letter-spacing:1px;}

.receipt{margin-top:16px; background:var(--paper); border:1.5px dashed var(--line-strong); border-radius:3px; padding:14px 16px;}
.receipt-row{display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:13px; border-bottom:1px dotted var(--line-strong);}
.receipt-row:last-child{border-bottom:none;}
.receipt-row .l{color:var(--muted);}
.receipt-row .v{font-family:'Space Mono',monospace; font-weight:700; text-align:right;}
.receipt-total{display:flex; justify-content:space-between; margin-top:8px; padding-top:10px; border-top:2px dashed var(--line-strong); font-weight:700;}
.receipt-total .v{font-family:'Space Mono',monospace; color:var(--stamp); font-size:16px;}
.copy-receipt-btn{width:100%; margin-top:12px; padding:11px; border-radius:3px; background:var(--bakong); color:#fff; font-weight:700; font-size:13px;
  display:flex; align-items:center; justify-content:center; gap:6px; border:1.5px solid var(--ink); box-shadow:2px 2px 0 var(--ink);}
.copy-receipt-btn.copied{background:var(--paid);}
.giftcard-note{font-size:13px; color:var(--muted); line-height:1.5; padding:4px 0; display:flex; align-items:center; gap:8px;}
.giftcard-code-box{margin-top:10px; padding:14px; border-radius:3px; background:#fff; border:1.5px dashed var(--stamp); text-align:center;}
.giftcard-code-box .l{font-size:11.5px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; justify-content:center; gap:5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700;}
.giftcard-code-box .code-value{font-family:'Space Mono',monospace; font-size:15px; font-weight:700; color:var(--ink); letter-spacing:.5px; word-break:break-all;}
.sheet .close-btn{width:100%; margin-top:16px; padding:12px; background:var(--paper); color:var(--muted); border-radius:3px; font-weight:700;
  border:1.5px solid var(--line-strong);}

/* ---------- footer ---------- */
footer{padding:30px 16px 40px; text-align:center; color:var(--muted); font-size:12px; border-top:2px dashed var(--line-strong); margin-top:12px;}
footer .fname{color:var(--ink); font-size:20px; letter-spacing:.8px; margin-bottom:6px;}
footer .links{display:flex; justify-content:center; gap:16px; margin:10px 0;}

.skeleton{background:linear-gradient(90deg, var(--paper) 25%, var(--paper-2) 37%, var(--paper) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite;
  border:1.5px dashed var(--line-strong);}
@keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:0 0;}}

.toast{position:fixed; left:16px; right:16px; bottom:20px; z-index:200; padding:13px 16px; border-radius:3px;
  background:var(--ink); color:var(--paper); font-size:13.5px; text-align:center; font-weight:600;
  transform:translateY(120%); transition:transform .25s ease;}
.toast.show{transform:translateY(0);}
.toast.err{background:var(--stamp); color:#fff;}

/* ---------- micro-interactions: press feedback ---------- */
.game-card, .product-card, .btn-primary, .back-btn, .contact-btn, .close-btn, .social-link{
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .15s ease, opacity .15s ease;
  will-change:transform;
}
.game-card:active, .contact-btn:active, .close-btn:active, .social-link:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line-strong) !important;}
.product-card:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line-strong) !important;}
.btn-primary:active:not(:disabled){transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink) !important;}
.back-btn:active{transform:translate(2px,2px) rotate(-4deg); box-shadow:1px 1px 0 var(--line-strong) !important;}
.product-card.selected{transform:translate(-1px,-1px);}

/* ---------- micro-interactions: scroll reveal ---------- */
.fade-in-section{opacity:0; transform:translateY(18px); transition:opacity .55s cubic-bezier(.2,.8,.2,1), transform .55s cubic-bezier(.2,.8,.2,1);}
.fade-in-section.visible{opacity:1; transform:translateY(0);}

/* ---------- social icons ---------- */
.social-row{display:flex; justify-content:center; align-items:center; gap:14px; margin:14px 0 6px;}
.social-link{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--card); border:1.5px solid var(--ink);}
.social-link svg{width:19px; height:19px;}
.social-link.telegram{color:#29A9EA;}
.social-link.facebook{color:#1877F2;}
.social-link.tiktok{color:var(--ink);}
.social-link:hover{box-shadow:2px 2px 0 var(--line-strong);}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(function(){
"use strict";

// ---- constants shared with the backend (must match server_v11.py) ----
const PAYLOAD_KEY = "uGos5IJrYJWhOedsoAVx6OE+xJpVVArCXYhnQfa4NZU=";
const PAY_TIMEOUT_SECONDS = 300; // 5 min KHQR expiry window

// ---- state ----
let state = {
  view: "home",       // home | game
  games: [],
  banners: [],
  settings: null,
  activeGame: null,
  products: [],
  productsLoading: false,
  selectedProduct: null,
  playerId: "",
  zoneId: "",
  idCheck: null,       // null | "checking" | {ok:true,name} | {ok:false}
  heroIndex: 0,
};

// ---- icon set (inline SVG, stroke-based — no emoji) ----
const ICONS = {

// ---- helpers ----
function $(sel, root){ return (root||document).querySelector(sel); }
function vibrate(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms || 10); }catch(e){} } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg, isErr){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=> t.classList.remove("show"), 3200);
}
async function api(path, opts){
  opts = opts || {};
  const res = await fetch("/api/" + path, {
    method: opts.method || "GET",
    headers: Object.assign({"Content-Type":"application/json"}, opts.headers||{}),
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data;
  try { data = await res.json(); } catch(e){ data = {}; }
  return data;
}
function decryptPayload(payloadB64){
  const bytes = CryptoJS.AES.decrypt(payloadB64, PAYLOAD_KEY);
  const text = bytes.toString(CryptoJS.enc.Utf8);
  return JSON.parse(text);
}

// ---- recent Player IDs (localStorage, per game — pure convenience, no server round-trip) ----
const RECENT_IDS_KEY = "pvh_recent_ids_v1";
function loadRecentIds(){
  try{ return JSON.parse(localStorage.getItem(RECENT_IDS_KEY) || "{}"); }catch(e){ return {}; }
}
function saveRecentId(gameCode, playerId, zoneId, name){
  if(!playerId) return;
  const all = loadRecentIds();
  const list = (all[gameCode] || []).filter(e => e.playerId !== playerId);
  list.unshift({ playerId, zoneId: zoneId || "", name: name || "", ts: Date.now() });
  all[gameCode] = list.slice(0, 3);
  try{ localStorage.setItem(RECENT_IDS_KEY, JSON.stringify(all)); }catch(e){}
}
function getRecentIds(gameCode){
  return (loadRecentIds()[gameCode] || []);
}
function lastUsedPlayerIdAnyGame(){
  const all = loadRecentIds();
  let best = null;
  Object.values(all).forEach(list => (list||[]).forEach(e => { if(!best || e.ts > best.ts) best = e; }));
  return best;
}

// ---- data loading ----
async function loadSiteSettings(){
  const r = await api("get-site-settings");
  if(r.success) state.settings = r.settings;
  renderTopbarAndFooter();
}
async function loadHome(){
  const r = await api("get-home-data");
  if(!r.success) { toast("មិនអាចផ្ទុកទិន្នន័យបានទេ", true); return; }
  const payload = decryptPayload(r.payload);
  state.games = payload.games || [];
  state.banners = payload.banners || [];
  render();
  startHeroRotation();
}
async function openGame(game){
  vibrate(8);
  state.activeGame = game;
  state.view = "game";
  state.products = [];
  state.productsLoading = true;
  state.selectedProduct = null;
  const recent = getRecentIds(game.code);
  const last = recent[0];
  state.playerId = last ? last.playerId : "";
  state.zoneId = last ? last.zoneId : "";
  state.idCheck = last ? {ok:true, name:last.name} : null;
  render();
  const r = await api("get-topup-data?id=" + encodeURIComponent(game.code));
  state.productsLoading = false;
  if(!r.success){ toast("មិនអាចផ្ទុក package បានទេ", true); render(); return; }
  const payload = decryptPayload(r.payload);
  state.products = payload.products || [];
  render();
}
function goHome(){
  vibrate(8);
  state.view = "home";
  state.activeGame = null;
  render();
}

// ---- ID validation (debounced) ----
let idCheckTimer = null;
function onIdInput(field, value){
  state[field] = value;
  state.idCheck = null;
  renderIdStatus();
  clearTimeout(idCheckTimer);
  const needsZone = !!state.activeGame.has_server_id;
  if(!state.playerId || (needsZone && !state.zoneId)) return;
  idCheckTimer = setTimeout(checkId, 550);
}
function isTelegramGame(g){
  return !!g && (g.fulfillment_type === "telegram_stars" || g.fulfillment_type === "telegram_premium");
}
async function checkId(){
  if(isTelegramGame(state.activeGame)){
    // Khmer TopUp has no player-name check for Telegram usernames —
    // skip the wasted round-trip and never block checkout on it.
    state.idCheck = null;
    renderIdStatus();
    return;
  }
  state.idCheck = "checking";
  renderIdStatus();
  const r = await api("check-user", {method:"POST", body:{
    gameCode: state.activeGame.code, userId: state.playerId, zoneId: state.zoneId || undefined,
  }});
  if(r.success && r.name){
    state.idCheck = {ok:true, name:r.name};
    saveRecentId(state.activeGame.code, state.playerId, state.zoneId, r.name);
  } else if(r.success && r.name === null){
    state.idCheck = null; // auto-check unavailable server-side, don't block checkout
  } else {
    state.idCheck = {ok:false};
  }
  renderIdStatus();
}
function renderIdStatus(){
  const el = $("#idStatus");
  if(!el) return;
  if(state.idCheck === "checking"){ el.textContent = "កំពុងឆែក ID..."; el.className = "id-status checking"; }
  else if(state.idCheck && state.idCheck.ok){ el.innerHTML = ICONS.check + " " + ICONS.user + " " + esc(state.idCheck.name); el.className = "id-status ok"; }
  else if(state.idCheck && !state.idCheck.ok){
    const label = isTelegramGame(state.activeGame) ? "រកមិនឃើញគណនី Telegram" : "រកមិនឃើញ Player ID";
    el.innerHTML = ICONS.cross + " " + label; el.className = "id-status err";
  }
  else { el.textContent = ""; el.className = "id-status"; }
  updateBuyBarState();
}

function selectProduct(id){
  vibrate(8);
  state.selectedProduct = state.products.find(p => p.id === id) || null;
  render();
}
function updateBuyBarState(){
  const btn = $("#buyBtn");
  if(!btn) return;
  const g = state.activeGame;
  if(g && g.fulfillment_type === "giftcard"){
    btn.disabled = !state.selectedProduct;
    return;
  }
  const needsZone = !!(g && g.has_server_id);
  const ready = state.selectedProduct && state.playerId && (!needsZone || state.zoneId) && !(state.idCheck && state.idCheck.ok === false);
  btn.disabled = !ready;
}

// ---- checkout / payment ----
let pollPayTimer = null, pollTopupTimer = null, countdownTimer = null;

async function buyNow(){
  if(!state.selectedProduct) return;
  vibrate(14);
  const amount = Number(state.selectedProduct.price);
  const userId = state.playerId;

  const btn = $("#buyBtn");
  if(btn){ btn.disabled = true; btn.textContent = "កំពុងបង្កើត QR..."; }

  const r = await api("create-payment", {
    method:"POST",
    body:{userId, zoneId: state.zoneId || "", gameCode: state.activeGame.code, productId: state.selectedProduct.id},
  });

  if(!r.success){
    toast(r.error || "បង្កើត QR មិនជោគជ័យ", true);
    if(btn){ btn.disabled = false; btn.textContent = "ទិញឥឡូវ"; }
    return;
  }
  openPaymentSheet(r.trx_id, r.qr_image, r.pay_url, amount);
}

function openPaymentSheet(trxId, qrImage, payUrl, amount){
  let secondsLeft = PAY_TIMEOUT_SECONDS;
  const root = document.createElement("div");
  root.className = "sheet-backdrop";
  root.id = "paySheet";
  root.innerHTML = `
    <div class="sheet">
      <h3>ស្កេន QR ដើម្បីទូទាត់</h3>
      <div class="sub">ABA PayWay</div>
      <div class="qr-frame" id="qrFrame">${qrImage ? `<img src="${qrImage}" alt="ABA PayWay QR">` : ""}</div>
      ${payUrl ? `<a class="pay-url-btn" href="${payUrl}" target="_blank" rel="noopener">បើកទំព័រទូទាត់</a>` : ""}
      <div class="pay-amount">$${amount.toFixed(2)}</div>
      <div class="pay-timer" id="payTimer">នៅសល់ 05:00</div>
      <div class="pay-status waiting" id="payStatus">កំពុងរង់ចាំការទូទាត់...</div>
      <button class="close-btn" id="closeSheetBtn">បិទ</button>
    </div>`;
  document.body.appendChild(root);

  $("#closeSheetBtn").onclick = () => closePaymentSheet(trxId, true);

  countdownTimer = setInterval(() => {
    secondsLeft--;
    const m = String(Math.floor(secondsLeft/60)).padStart(2,"0");
    const s = String(secondsLeft%60).padStart(2,"0");
    const timerEl = $("#payTimer");
    if(timerEl) timerEl.textContent = `នៅសល់ ${m}:${s}`;
    if(secondsLeft <= 0){
      clearInterval(countdownTimer);
      api("expire-payment", {method:"POST", body:{trx_id: trxId}});
      setPayStatus("failed", "QR ផុតកំណត់ — សូមចាប់ផ្តើមម្តងទៀត");
      clearInterval(pollPayTimer);
    }
  }, 1000);

  pollPayTimer = setInterval(async () => {
    const r = await api("check-payment", {method:"POST", body:{trx_id: trxId}});
    if(r.paid){
      clearInterval(pollPayTimer);
      clearInterval(countdownTimer);
      const ds = (r.data && r.data.delivery_status) || null;
      handleDeliveryStatus(trxId, ds, r.data || null);
    } else if(r.expired){
      clearInterval(pollPayTimer);
      clearInterval(countdownTimer);
      setPayStatus("failed", "QR ផុតកំណត់ — សូមចាប់ផ្តើមម្តងទៀត");
    }
  }, 3000);
}

function setPayStatus(kind, html){
  const el = $("#payStatus");
  if(!el) return;
  el.className = "pay-status " + kind;
  el.innerHTML = html;
}

function fmtDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "—";
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function deliveryStatusLabel(ds){
  if(ds === "delivered") return "✓ បានបញ្ជូនស្វ័យប្រវត្តិ";
  if(ds === "processing") return "កំពុងបញ្ជូន";
  if(ds === "failed") return "បញ្ជូនមិនកើត — ត្រូវការ manual";
  return "រង់ចាំ admin បញ្ជូន";
}
function receiptText(order, trxId){
  const g = state.activeGame, p = state.selectedProduct;
  const isGiftcard = g && g.fulfillment_type === "giftcard";
  const idLine = isTelegramGame(g) ? "Telegram Username" : "Player ID";
  const lines = [
    `វិក័យប័ត្រ PVH TOPUP`,
    `Trx ID: ${trxId}`,
    `ថ្ងៃ: ${fmtDateTime(order.paid_at || order.created_at)}`,
    `ហ្គេម: ${g ? g.name : order.game_code}`,
    `Package: ${p ? p.name : ""}`,
  ];
  if(!isGiftcard) lines.push(`${idLine}: ${order.user_id}${order.zone_id ? " ("+order.zone_id+")" : ""}`);
  lines.push(`តម្លៃ: $${Number(order.amount).toFixed(2)}`);
  lines.push(`ស្ថានភាព: ${deliveryStatusLabel(order.delivery_status)}`);
  if(order.delivery_code) lines.push(`Gift Card Code: ${order.delivery_code}`);
  return lines.join("\n");
}
function renderReceipt(order, trxId){
  const sheetEl = $("#paySheet .sheet");
  if(!sheetEl) return;
  const g = state.activeGame, p = state.selectedProduct;
  const old = $("#receiptBlock");
  if(old) old.remove();
  const isGiftcard = g && g.fulfillment_type === "giftcard";
  const idLabel = isTelegramGame(g) ? "Telegram Username" : "Player ID";
  const block = document.createElement("div");
  block.className = "receipt";
  block.id = "receiptBlock";
  block.innerHTML = `
    <div class="receipt-row"><span class="l">Trx ID</span><span class="v">${esc(trxId)}</span></div>
    <div class="receipt-row"><span class="l">ថ្ងៃ</span><span class="v">${esc(fmtDateTime(order.paid_at || order.created_at))}</span></div>
    <div class="receipt-row"><span class="l">ហ្គេម</span><span class="v">${esc(g ? g.name : order.game_code)}</span></div>
    <div class="receipt-row"><span class="l">Package</span><span class="v">${esc(p ? p.name : "")}</span></div>
    ${isGiftcard ? "" : `<div class="receipt-row"><span class="l">${idLabel}</span><span class="v">${esc(order.user_id)}${order.zone_id ? " ("+esc(order.zone_id)+")" : ""}</span></div>`}
    <div class="receipt-row"><span class="l">ស្ថានភាព</span><span class="v">${esc(deliveryStatusLabel(order.delivery_status))}</span></div>
    <div class="receipt-total"><span>សរុប</span><span class="v">$${Number(order.amount).toFixed(2)}</span></div>
    ${order.delivery_code ? `
      <div class="giftcard-code-box">
        <div class="l">${ICONS.image} Gift Card Code — redeem លើ roblox.com</div>
        <div class="code-value" id="giftcardCodeValue">${esc(order.delivery_code)}</div>
      </div>
      <button class="copy-receipt-btn" id="copyCodeBtn">${ICONS.check} ចម្លង Code</button>
    ` : ""}
    <button class="copy-receipt-btn" id="copyReceiptBtn">${ICONS.chat} ចម្លងវិក័យប័ត្រ</button>
  `;
  sheetEl.insertBefore(block, $("#closeSheetBtn"));
  if(order.delivery_code){
    $("#copyCodeBtn").onclick = async () => {
      const btn = $("#copyCodeBtn");
      try{
        await navigator.clipboard.writeText(order.delivery_code);
        btn.classList.add("copied");
        btn.innerHTML = `${ICONS.check} បានចម្លង Code!`;
        setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = `${ICONS.check} ចម្លង Code`; }, 2000);
      }catch(e){ toast("មិនអាចចម្លងបានទេ", true); }
    };
  }
  $("#copyReceiptBtn").onclick = async () => {
    const btn = $("#copyReceiptBtn");
    try{
      await navigator.clipboard.writeText(receiptText(order, trxId));
      btn.classList.add("copied");
      btn.innerHTML = `${ICONS.check} បានចម្លង!`;
      setTimeout(()=>{ btn.classList.remove("copied"); btn.innerHTML = `${ICONS.chat} ចម្លងវិក័យប័ត្រ`; }, 2000);
    }catch(e){ toast("មិនអាចចម្លងបានទេ", true); }
  };
}

function handleDeliveryStatus(trxId, ds, order){
  if(ds === "delivered"){
    setPayStatus("success", ICONS.check + " ទូទាត់ជោគជ័យ — ទទួល Diamond ដោយស្វ័យប្រវត្តិ!");
  } else if(ds === "processing"){
    setPayStatus("processing", ICONS.clock + " កំពុងបញ្ជូន Diamond ស្វ័យប្រវត្តិ...");
    pollTopupTimer = setInterval(async () => {
      const r = await api("check-topup-status", {method:"POST", body:{trx_id: trxId}});
      if(r.delivery_status === "delivered"){
        clearInterval(pollTopupTimer);
        setPayStatus("success", ICONS.check + " ទូទាត់ជោគជ័យ — ទទួល Diamond ដោយស្វ័យប្រវត្តិ!");
        if(order){ order.delivery_status = "delivered"; renderReceipt(order, trxId); }
      } else if(r.delivery_status === "failed"){
        clearInterval(pollTopupTimer);
        setPayStatus("failed", "ទូទាត់ជោគជ័យ ប៉ុន្តែបញ្ជូនស្វ័យប្រវត្តិមិនកើត — ទាក់ទង admin ខាងក្រោម");
        if(order){ order.delivery_status = "failed"; renderReceipt(order, trxId); }
      }
    }, 4000);
  } else if(ds === "failed"){
    setPayStatus("failed", "ទូទាត់ជោគជ័យ ប៉ុន្តែបញ្ជូនស្វ័យប្រវត្តិមិនកើត — ទាក់ទង admin ខាងក្រោម");
  } else {
    setPayStatus("success", ICONS.check + " ទូទាត់ជោគជ័យ — admin នឹងបញ្ជូនជូនក្នុងពេលឆាប់ៗ");
  }
  if(order) renderReceipt(order, trxId);
}

function closePaymentSheet(trxId, userClosed){
  clearInterval(pollPayTimer); clearInterval(pollTopupTimer); clearInterval(countdownTimer);
  const el = $("#paySheet");
  if(el) el.remove();
  const btn = $("#buyBtn");
  if(btn){ btn.disabled = false; btn.textContent = "ទិញឥឡូវ"; }
  if(userClosed && trxId) api("expire-payment", {method:"POST", body:{trx_id: trxId}}).catch(()=>{});
}

// ---- hero rotation ----
let heroTimer = null;
function startHeroRotation(){
  clearInterval(heroTimer);
  const slides = (state.banners||[]).filter(b => b.type === "main_slider");
  if(slides.length < 2) return;
  heroTimer = setInterval(() => {
    state.heroIndex = (state.heroIndex + 1) % slides.length;
    const track = $("#heroTrack");
    if(track) track.style.transform = `translateX(-${state.heroIndex*100}%)`;
    document.querySelectorAll(".hero-dots span").forEach((d,i)=>d.classList.toggle("active", i===state.heroIndex));
  }, 4000);
}

// ---- micro-interactions: reveal sections as they scroll into view ----
let revealObserver = null;
function initScrollReveal(){
  if(!("IntersectionObserver" in window)) return;
  if(!revealObserver){
    revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add("visible");
          revealObserver.unobserve(entry.target);
        }
      });
    }, {threshold:0.12, rootMargin:"0px 0px -40px 0px"});
  }
  const targets = document.querySelectorAll(
    "#main .section, #main .game-grid, #main .product-grid, #main .id-form, #main .hero, #main .promo-strip, #main .detail-header"
  );
  targets.forEach(el => {
    if(!el.classList.contains("fade-in-section")){
      el.classList.add("fade-in-section");
      revealObserver.observe(el);
    }
  });
}

function renderHeroAndPromo(){
  const mainSlides = (state.banners||[]).filter(b=>b.type==="main_slider");
  const promoSlides = (state.banners||[]).filter(b=>b.type==="small_promo");
  const hero = mainSlides.length ? `
    <div class="hero">
      <div class="hero-track" id="heroTrack">
        ${mainSlides.map(b => `<div class="hero-slide"><img src="${esc(b.image_url)}" alt=""></div>`).join("")}
      </div>
      ${mainSlides.length>1 ? `<div class="hero-dots">${mainSlides.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join("")}</div>` : ""}
    </div>` : `<div class="hero"><div class="hero-empty">${ICONS.image} មិនទាន់មាន banner</div></div>`;
  const promo = promoSlides.length ? `
    <div class="promo-strip">${promoSlides.map(b=>`<img src="${esc(b.image_url)}" alt="">`).join("")}</div>` : "";
  return hero + promo;
}

function renderGame(){
  const g = state.activeGame;
  const needsZone = !!g.has_server_id;
  const productsHtml = state.productsLoading
    ? `<div class="skeleton" style="height:140px;border-radius:12px;"></div><div class="skeleton" style="height:140px;border-radius:12px;"></div><div class="skeleton" style="height:140px;border-radius:12px;"></div><div class="skeleton" style="height:140px;border-radius:12px;"></div>`
    : (state.products.length ? state.products.map(p => `
    <div class="product-card facet ${state.selectedProduct && state.selectedProduct.id===p.id ? 'selected':''}" onclick="__app.selectProduct(${p.id})">
      ${p.section==='recommend' ? `<span class="badge">${ICONS.star} ពេញនិយម</span>` : ""}

        ${p.image_url ? `<img src="${esc(p.image_url)}" alt="" loading="lazy">` : `<span class="fallback">${ICONS.diamond}</span>`}
      </div>
      <div class="pname">${esc(p.name)}</div>
      <div class="pprice">$${Number(p.price).toFixed(2)}</div>
    </div>`).join("") : `<div class="empty-products">${ICONS.image} មិនទាន់មាន package សម្រាប់ហ្គេមនេះទេ — សូមទាក់ទង admin</div>`);

    </div>` : "";

  const isGiftcard = g.fulfillment_type === "giftcard";
  const isTelegram = isTelegramGame(g);
  const idLabel = isTelegram ? "Telegram Username" : "Player ID";
  const idPlaceholder = isTelegram ? "បញ្ចូល Username (ឧ. @yourname)" : "បញ្ចូល Player ID";
  const telegramNote = g.fulfillment_type === "telegram_stars"
    ? (ICONS.star + " Stars នឹងផ្ញើទៅគណនី Telegram របស់អ្នកដោយផ្ទាល់ — សូមប្រាកដថា Username ត្រឹមត្រូវ")
    : (ICONS.star + " Telegram Premium នឹងផ្ញើទៅគណនីរបស់អ្នកដោយផ្ទាល់ — សូមប្រាកដថា Username ត្រឹមត្រូវ");

  return `
    <div class="detail-header">
      <div class="back-btn" onclick="__app.goHome()">${ICONS.chevronLeft}</div>
      <div class="gname">${esc(g.name)}</div>
    </div>
    ${isGiftcard ? `
    <div class="id-form">
      <div class="giftcard-note">${ICONS.image} ទិញរួច នឹងទទួល Gift Card Code ភ្លាមៗ — ត្រូវ redeem ដោយខ្លួនឯងលើ roblox.com</div>
